    if(error){ delete row.nombre; ({error} = await sb.from("resenas").insert(row)); }
    if(error){ $("#rOk").disabled = false; return toast("No se pudo enviar, intenta de nuevo"); }
    app.innerHTML = `<div class="appv center"><div class="ok-anim"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg></div>
      <h1 class="app-title">¡Gracias!</h1><p class="app-sub">Tu reseña fue enviada.</p><button class="pill pill-white" data-reservar>Agendar mi próximo corte ${IC.arrowR}</button></div>`;
    cargarDatosBase();
  };
}
</script>
<script>
/* ============================================================
   PANEL DEL NEGOCIO (referencia: POS de iPad)
   ============================================================ */
const TABS = [["hoy","Hoy"],["agenda","Agenda"],["clientes","Clientes"],["servicios","Servicios"],["estilos","Estilos"],["horario","Horario"],["pagina","Página"],["espera","Espera"],["resenas","Reseñas"],["ajustes","Ajustes"]];
const ESTADOS = {confirmada:["Confirmada","c"], completada:["Completada","ok"], cancelada:["Cancelada","bad"], no_asistio:["No asistió","bad"]};

async function renderAdmin(app){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderLogin(app);
  if(!S.agFecha) S.agFecha = isoDate(new Date());
  app.innerHTML = `<div class="adm">
    <div class="adm-main">
      <div class="adm-top">
        <div class="adm-brand"><img src="${LOGO}" alt=""><div><b>Panel del negocio</b><span>${fmtFechaLarga(isoDate(new Date()))}</span></div></div>
        <div class="adm-top-r"><button class="circ" data-go="inicio" aria-label="Ver página" title="Ver página">${IC.eye}</button><button class="circ" id="admOut" aria-label="Cerrar sesión" title="Cerrar sesión">${IC.out}</button></div>
      </div>
      <nav class="adm-tabs" id="admTabs">${TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.adminTab===k?"on":""}">${l}</button>`).join("")}</nav>
      <div id="admBody"></div>
    </div>
    <aside class="adm-side" id="admSide"></aside>
  </div>`;
  $("#admTabs").onclick = e=>{ const b = e.target.closest("[data-tab]"); if(!b) return; irTab(b.dataset.tab); };
  $("#admOut").onclick = async ()=>{ await sb.auth.signOut(); render(); };
  const on = $("#admTabs .on"); if(on) on.scrollIntoView({inline:"center", block:"nearest"});
  await refrescarAdmin();
}
function irTab(k){
  S.adminTab = k;
  $$("#admTabs button").forEach(x=> x.classList.toggle("on", x.dataset.tab === k));
  const b = $(`#admTabs [data-tab="${k}"]`); if(b) b.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  pintarTab();
}
async function refrescarAdmin(){ await Promise.all([pintarTab(), pintarLateral()]); }
async function pintarTab(){
  const box = $("#admBody"); if(!box) return;
  box.style.animation = "none"; void box.offsetWidth; box.style.animation = "";
  const f = {hoy:tabHoy, agenda:tabAgenda, clientes:tabClientes, servicios:tabServicios, estilos:tabEstilos, horario:tabHorario, pagina:tabPagina, espera:tabEspera, resenas:tabResenas, ajustes:tabAjustes}[S.adminTab];
  try{ await f(box); }catch(e){ console.error(e); box.innerHTML = `<div class="adm-empty">No se pudo cargar esta sección. Revisa tu conexión o que ejecutaste el SQL.</div>`; }
}

function renderLogin(app){
  app.innerHTML = `<div class="login enter">
    <img class="login-logo" src="${LOGO}" alt="">
    <h1 class="app-title">Panel del negocio</h1><p class="app-sub">Ingresa para administrar tu barbería</p>
    <div class="login-card">
      <div class="field"><label for="lgMail">Correo</label><input id="lgMail" type="email" autocomplete="username"></div>
      <div class="field"><label for="lgPass">Contraseña</label><input id="lgPass" type="password" autocomplete="current-password"></div>
      <button class="pill pill-white pill-block" id="lgOk">Ingresar ${IC.arrowR}</button>
    </div></div>`;
  const entrar = async ()=>{
    const btn = $("#lgOk"); btn.disabled = true;
    const {error} = await sb.auth.signInWithPassword({email: $("#lgMail").value.trim(), password: $("#lgPass").value});
    if(error){ btn.disabled = false; return toast("Correo o contraseña incorrectos"); }
    render();
  };
  $("#lgOk").onclick = entrar; $("#lgPass").onkeydown = e=>{ if(e.key === "Enter") entrar(); };
}

/* ---------------- citas: datos y acciones ---------------- */
async function citasDelDia(fecha){
  const {data} = await sb.from("citas").select("*, clientes(id,nombre,telefono,notas,puntos_actuales), servicios(nombre,precio,duracion_minutos), estilos_corte(nombre)").eq("fecha", fecha).order("hora_inicio");
  return data || [];
}
function linkRecordatorio(c){
  const cl = c.clientes || {};
  return waLink(cl.telefono, plantilla(S.config.msg_recordatorio || DEF_RECORD, {nombre: primerNombre(cl.nombre), servicio: (c.servicios||{}).nombre || "", fecha: fmtFechaLarga(c.fecha), hora: hhmm(c.hora_inicio), negocio: S.config.nombre || ""}));
}
function ordHtml(c, i, opt={}){
  const cl = c.clientes || {}, sv_ = c.servicios || {}, [txt, cls] = ESTADOS[c.estado] || [c.estado, ""];
  const acciones = c.estado === "confirmada"
    ? `${cl.telefono ? `<a class="mini c" href="${linkRecordatorio(c)}" target="_blank" rel="noopener">${IC.wa} Recordar</a>` : ""}
       <button class="mini ok" data-act="done" data-id="${c.id}">${IC.check} Listo</button>
       <button class="mini" data-act="noshow" data-id="${c.id}">No vino</button>
       ${opt.full ? `<button class="mini danger" data-act="cancel" data-id="${c.id}">Cancelar</button>` : ""}`
    : `<span class="badge ${cls}">${txt}</span>`;
  return `<div class="ord ${opt.next?"next":""} ${c.estado}" style="--i:${i}">
    <span class="av">${esc(iniciales(cl.nombre))}</span>
    <div class="ord-i"><b>${esc(cl.nombre || "Cliente")}</b>
      <span>${esc(sv_.nombre || "")}${c.estilos_corte ? " · " + esc(c.estilos_corte.nombre) : ""}</span>
      ${opt.full && cl.telefono ? `<span>${esc(cl.telefono)}</span>` : ""}
      ${cl.notas ? `<span class="ord-note">${esc(cl.notas)}</span>` : ""}
      <div class="ord-acts">${acciones}</div></div>
    <div class="ord-r"><b>${hhmm(c.hora_inicio)}</b><span>${money(sv_.precio)}</span></div>
  </div>`;
}
function cablearOrd(root, citas){
  root.addEventListener("click", async e=>{
    const b = e.target.closest("[data-act]"); if(!b) return;
    const c = citas.find(x=> x.id === b.dataset.id); if(!c) return;
    if(b.dataset.act === "done"){
      b.disabled = true;
      await sb.from("citas").update({estado:"completada"}).eq("id", c.id);
      if(S.config.fidelidad_activa && c.clientes && c.clientes.id){
        await sb.from("clientes").update({puntos_actuales: (Number(c.clientes.puntos_actuales)||0) + (Number(S.config.puntos_por_visita)||1)}).eq("id", c.clientes.id);
      }
      toast("Cita completada"); refrescarAdmin();
    }
    if(b.dataset.act === "noshow"){ await sb.from("citas").update({estado:"no_asistio"}).eq("id", c.id); toast("Marcada como no asistió"); refrescarAdmin(); }
    if(b.dataset.act === "cancel"){
      confirmar("¿Cancelar la cita?", `${(c.clientes||{}).nombre||"Cliente"} · ${fmtFechaLarga(c.fecha)} a las ${hhmm(c.hora_inicio)}.`, "Sí, cancelar", async ()=>{
        await sb.from("citas").update({estado:"cancelada"}).eq("id", c.id); S.citasAt = 0;
        const {count} = await sb.from("waitlist").select("*", {count:"exact", head:true}).eq("fecha_deseada", c.fecha).eq("estado","esperando");
        refrescarAdmin();
        if(count) setTimeout(()=> openSheet(`<h3>Espacio liberado</h3><p class="sub">Hay ${count} ${count===1?"persona":"personas"} en lista de espera para el ${fmtFechaLarga(c.fecha)}.</p>
          <button class="pill pill-white pill-block" id="goEsp">Ver lista de espera ${IC.arrowR}</button>`, sh=> $("#goEsp",sh).onclick = ()=>{ closeSheet(); irTab("espera"); }), 420);
        else toast("Cita cancelada");
      });
    }
  });
}

/* ---------------- columna lateral "Tu día" ---------------- */
async function pintarLateral(){
  const side = $("#admSide"); if(!side || window.innerWidth < 1150) return;
  const hoy = isoDate(new Date()), citas = await citasDelDia(hoy);
  side.innerHTML = lateralHtml(citas);
  cablearOrd(side, citas);
  $("#sideAg", side).onclick = ()=>{ S.agFecha = hoy; irTab("agenda"); };
}
function lateralHtml(citas){
  const act = citas.filter(c=> c.estado !== "cancelada" && c.estado !== "no_asistio");
  const total = act.reduce((a,c)=> a + Number((c.servicios||{}).precio || 0), 0);
  const hechas = citas.filter(c=> c.estado === "completada").length;
  const ahora = ahoraHHMM();
  const next = citas.find(c=> c.estado === "confirmada" && hhmm(c.hora_fin) > ahora);
  return `<h3 class="side-h">Tu día</h3><p class="side-sub">${act.length} ${act.length===1?"cita":"citas"} · ${hechas} completadas</p>
    <div class="side-list">${citas.length ? citas.map((c,i)=> ordHtml(c, i, {next: next && next.id === c.id})).join("") : `<div class="adm-empty">Sin citas para hoy.</div>`}</div>
    <div class="side-total"><div class="row"><span>Ingresos estimados<br>de hoy</span><b>${money(total)}</b></div>
    <button class="pill pill-white pill-block" id="sideAg">Abrir agenda ${IC.arrowR}</button></div>`;
}

/* ---------------- HOY ---------------- */
async function tabHoy(box){
  const hoy = isoDate(new Date());
  const [citas, cls] = await Promise.all([citasDelDia(hoy), sb.from("clientes").select("*", {count:"exact", head:true})]);
  const act = citas.filter(c=> c.estado !== "cancelada" && c.estado !== "no_asistio");
  const total = act.reduce((a,c)=> a + Number((c.servicios||{}).precio || 0), 0);
  const ahora = ahoraHHMM();
  const next = citas.find(c=> c.estado === "confirmada" && hhmm(c.hora_fin) > ahora);
  const tiles = [["Citas hoy", act.length], ["Ingresos estimados", money(total)], ["Clientes", cls.count || 0], ["Calificación", S.promedio || "—"]];
  box.innerHTML = `
    <div class="stat-tiles">${tiles.map(([l,v],i)=>`<div class="stile" style="--i:${i}"><span>${l}</span><b>${v}</b></div>`).join("")}</div>
    ${next ? `<div class="next-card">
      <div class="nt"><small>SIGUIENTE</small>${hhmm(next.hora_inicio)}</div>
      <div><b>${esc((next.clientes||{}).nombre || "Cliente")}</b><span>${esc((next.servicios||{}).nombre || "")}${next.estilos_corte ? " · " + esc(next.estilos_corte.nombre) : ""}</span>${(next.clientes||{}).notas ? `<span style="color:#8a5a1f;margin-top:6px">${esc(next.clientes.notas)}</span>` : ""}</div>
      <div class="acts">${(next.clientes||{}).telefono ? `<a class="pill pill-black pill-sm" href="${linkRecordatorio(next)}" target="_blank" rel="noopener">${IC.wa} Recordar</a>` : ""}<button class="pill pill-ghost pill-sm" style="color:#111;box-shadow:inset 0 0 0 1px #bbb" data-act="done" data-id="${next.id}">${IC.check} Marcar listo</button></div>
    </div>` : ""}
    <div class="only-mobile"><h3 class="side-h" style="margin-top:8px">Tu día</h3><p class="side-sub">${act.length} ${act.length===1?"cita":"citas"} para hoy</p>
      <div class="side-list">${citas.length ? citas.map((c,i)=> ordHtml(c, i, {next: next && next.id === c.id})).join("") : `<div class="adm-empty">Sin citas para hoy.</div>`}</div></div>
    <div class="quick">
      <button id="qkCita">${IC.plus}Nueva cita</button>
      <button id="qkBloq">${IC.block}Bloquear un día</button>
      <button id="qkServ">${IC.scissors}Nuevo servicio</button>
      <button id="qkQr">${IC.qr}QR para agendar</button>
    </div>`;
  cablearOrd(box, citas);
  $("#qkCita").onclick = ()=> hojaNuevaCita({fecha: hoy});
  $("#qkBloq").onclick = ()=> irTab("horario");
  $("#qkServ").onclick = ()=> hojaServicio(null);
  $("#qkQr").onclick = ()=> irTab("ajustes");
}

/* ---------------- AGENDA ---------------- */
async function tabAgenda(box){
  const f = S.agFecha, citas = await citasDelDia(f);
  const act = citas.filter(c=> c.estado !== "cancelada");
  box.innerHTML = `
    <div class="ag-nav">
      <button class="circ" id="agPrev" aria-label="Día anterior">${IC.chevL}</button>
      <div class="ag-day"><b>${fmtFechaLarga(f)}</b><span>${act.length} ${act.length===1?"cita":"citas"} · ${money(act.reduce((a,c)=> a + Number((c.servicios||{}).precio||0), 0))}</span></div>
      <button class="circ" id="agNext" aria-label="Día siguiente">${IC.chevR}</button>
      <input type="date" id="agDate" value="${f}" aria-label="Elegir fecha">
      <button class="pill pill-white pill-sm" id="agNew">${IC.plus} Nueva cita</button>
    </div>
    <div id="agList">${citas.length ? citas.map((c,i)=> ordHtml(c, i, {full:true})).join("") : `<div class="adm-empty">No hay citas este día.</div>`}</div>`;
  const mover = n=>{ const d = parseIso(S.agFecha); d.setDate(d.getDate() + n); S.agFecha = isoDate(d); pintarTab(); };
  $("#agPrev").onclick = ()=> mover(-1); $("#agNext").onclick = ()=> mover(1);
  $("#agDate").onchange = e=>{ if(e.target.value){ S.agFecha = e.target.value; pintarTab(); } };
  $("#agNew").onclick = ()=> hojaNuevaCita({fecha: S.agFecha});
  cablearOrd($("#agList"), citas);
}

async function hojaNuevaCita(pre={}){
  const {data:servs} = await sb.from("servicios").select("*").eq("activo", true).order("orden");
  if(!servs || !servs.length) return toast("Primero crea un servicio");
  openSheet(`<h3>Nueva cita</h3><p class="sub">Para clientes que te escriben o llegan sin cita.</p>
    <div class="field"><label>Servicio</label><select id="ncServ">${servs.map(s=>`<option value="${s.id}">${esc(s.nombre)} · ${durTxt(s.duracion_minutos)} · ${money(s.precio)}</option>`).join("")}</select></div>
    <div class="grid2">
      <div class="field"><label>Fecha</label><input id="ncFecha" type="date" value="${pre.fecha || isoDate(new Date())}"></div>
      <div class="field"><label>Hora</label><select id="ncHora"></select></div>
    </div>
    <div class="field hidden" id="ncOtraBox"><label>Hora manual</label><input id="ncOtra" type="time"></div>
    <div class="grid2">
      <div class="field"><label>Nombre del cliente</label><input id="ncNom" value="${esc(pre.nombre||"")}"></div>
      <div class="field"><label>WhatsApp</label><input id="ncTel" type="tel" inputmode="tel" value="${esc(pre.telefono||"")}"></div>
    </div>
    <button class="pill pill-white pill-block" id="ncOk">Guardar cita</button>`, async sh=>{
    const serv = ()=> servs.find(s=> String(s.id) === $("#ncServ",sh).value);
    const cargarHoras = async ()=>{
      const f = $("#ncFecha",sh).value; if(!f) return;
      const {data} = await sb.from("citas").select("hora_inicio,hora_fin,estado").eq("fecha", f).neq("estado","cancelada");
      S.citasMap[f] = (data||[]).map(c=> ({hora_inicio:hhmm(c.hora_inicio), hora_fin:hhmm(c.hora_fin), estado:c.estado}));
      const libres = calcularSlots(f, serv().duracion_minutos).filter(s=> !s.ocupado);
      $("#ncHora",sh).innerHTML = libres.map(s=>`<option value="${s.hora}">${s.hora}</option>`).join("") + `<option value="otra">Otra hora…</option>`;
      $("#ncOtraBox",sh).classList.toggle("hidden", libres.length > 0);
      if(!libres.length) $("#ncHora",sh).value = "otra";
    };
    $("#ncServ",sh).onchange = cargarHoras; $("#ncFecha",sh).onchange = cargarHoras;
    $("#ncHora",sh).onchange = e=> $("#ncOtraBox",sh).classList.toggle("hidden", e.target.value !== "otra");
    await cargarHoras();
    $("#ncOk",sh).onclick = async ()=>{
      const s = serv(), fecha = $("#ncFecha",sh).value;
      const hora = $("#ncHora",sh).value === "otra" ? $("#ncOtra",sh).value : $("#ncHora",sh).value;
      const nom = $("#ncNom",sh).value.trim(), tel = $("#ncTel",sh).value.trim();
      if(!fecha || !hora) return toast("Elige fecha y hora");
      if(nom.length < 2 || soloDigitos(tel).length < 8) return toast("Completa nombre y WhatsApp del cliente");
      $("#ncOk",sh).disabled = true;
      try{
        const cl = await obtenerCliente(nom, tel);
        const {error} = await sb.from("citas").insert({cliente_id: cl.id, servicio_id: s.id, fecha, hora_inicio: hora, hora_fin: addMin(hora, s.duracion_minutos), estado:"confirmada"});
        if(error){ $("#ncOk",sh).disabled = false; return toast("Ese horario se traslapa con otra cita"); }
        closeSheet(); toast("Cita agendada"); S.citasAt = 0; S.agFecha = fecha; refrescarAdmin();
      }catch(e){ console.error(e); $("#ncOk",sh).disabled = false; toast("No se pudo guardar"); }
    };
  });
}

/* ---------------- CLIENTES (relación barbero-cliente) ---------------- */
async function tabClientes(box){
  box.innerHTML = `<div class="adm-bar"><label class="search">${IC.search}<input id="clQ" placeholder="Buscar por nombre o teléfono" aria-label="Buscar cliente"></label></div><div id="clList"></div>`;
  let t;
  const buscar = async ()=>{
    const q = $("#clQ").value.trim().replace(/[%,()]/g,"");
    let query = sb.from("clientes").select("*").order("creado_en", {ascending:false}).limit(150);
    if(q) query = query.or(`nombre.ilike.%${q}%,telefono.ilike.%${soloDigitos(q) || q}%`);
    const {data} = await query;
    const lista = data || [];
    $("#clList").innerHTML = lista.length ? lista.map((c,i)=>{
      const pref = S.estilos.find(e=> e.id === c.estilo_preferido_id);
      return `<button class="cl-row" data-cl="${c.id}" style="--i:${Math.min(i,12)}"><span class="av">${esc(iniciales(c.nombre))}</span>
        <div class="ci"><b>${esc(c.nombre)}</b><span>${esc(c.telefono)}${pref ? " · " + esc(pref.nombre) : ""}${c.notas ? " · " + esc(c.notas) : ""}</span></div>
        ${S.config.fidelidad_activa ? `<span class="badge c">${Number(c.puntos_actuales)||0} pts</span>` : ""}${IC.chevR}</button>`; }).join("")
      : `<div class="adm-empty">${q ? "Sin resultados." : "Aún no hay clientes. Se crean solos cuando alguien agenda."}</div>`;
    $$("[data-cl]", box).forEach(b=> b.onclick = ()=> hojaCliente(lista.find(x=> x.id === b.dataset.cl)));
  };
  $("#clQ").oninput = ()=>{ clearTimeout(t); t = setTimeout(buscar, 250); };
  await buscar();
}
async function hojaCliente(c){
  const {data:hist} = await sb.from("citas").select("fecha,hora_inicio,estado,servicios(nombre)").eq("cliente_id", c.id).order("fecha", {ascending:false}).limit(6);
  const {data:todos} = await sb.from("estilos_corte").select("id,nombre").order("orden");
  openSheet(`<h3>${esc(c.nombre)}</h3><p class="sub">${esc(c.telefono)} · cliente desde ${c.creado_en ? fmtFecha(String(c.creado_en).slice(0,10)) : "—"}</p>
    <div class="grid2">
      <div class="field"><label>Nombre</label><input id="hcNom" value="${esc(c.nombre)}"></div>
      <div class="field"><label>Estilo preferido</label><select id="hcEst"><option value="">Sin preferencia</option>${(todos||[]).map(e=>`<option value="${e.id}" ${e.id===c.estilo_preferido_id?"selected":""}>${esc(e.nombre)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Notas del barbero</label><textarea id="hcNotas" placeholder="Ej. No muy corto atrás, número 2 a los lados, piel sensible">${esc(c.notas||"")}</textarea><small>Las verás junto a cada cita de este cliente.</small></div>
    ${S.config.fidelidad_activa ? `<div class="field"><label>Puntos de fidelidad</label><input id="hcPts" type="number" min="0" value="${Number(c.puntos_actuales)||0}"></div>` : ""}
    ${hist && hist.length ? `<p class="lbl" style="margin-top:6px">Últimas visitas</p><div class="hist" style="margin-bottom:16px">${hist.map(h=>`<span>${fmtFecha(h.fecha)} · ${esc((h.servicios||{}).nombre||"")} · ${(ESTADOS[h.estado]||[h.estado])[0]}</span>`).join("")}</div>` : ""}
    <div class="sh-actions">
      <a class="pill pill-ghost" href="${waLink(c.telefono)}" target="_blank" rel="noopener">${IC.wa} WhatsApp</a>
      <button class="pill pill-ghost" id="hcCita">${IC.plus} Cita</button>
    </div>
    <button class="pill pill-white pill-block" id="hcOk" style="margin-top:10px">Guardar cambios</button>`, sh=>{
    $("#hcCita",sh).onclick = ()=>{ closeSheet(); setTimeout(()=> hojaNuevaCita({nombre:c.nombre, telefono:c.telefono, fecha:S.agFecha}), 400); };
    $("#hcOk",sh).onclick = async ()=>{
      const upd = {nombre: $("#hcNom",sh).value.trim() || c.nombre, estilo_preferido_id: $("#hcEst",sh).value ? Number($("#hcEst",sh).value) : null, notas: $("#hcNotas",sh).value.trim()};
      if($("#hcPts",sh)) upd.puntos_actuales = Math.max(0, Number($("#hcPts",sh).value)||0);
      const {error} = await sb.from("clientes").update(upd).eq("id", c.id);
      if(error) return toast("No se pudo guardar");
      closeSheet(); toast("Cliente actualizado"); pintarTab();
    };
  });
}

/* ---------------- SERVICIOS ---------------- */
async function tabServicios(box){
  const {data} = await sb.from("servicios").select("*").order("orden");
  const todos = data || [];
  const cats = [...new Set(todos.map(s=> (s.categoria||"").trim()).filter(Boolean))];
  box.innerHTML = `<div class="adm-bar">
      <label class="search">${IC.search}<input id="asQ" placeholder="Buscar por nombre, precio o duración" aria-label="Buscar servicio"></label>
      ${cats.length ? `<select class="selectc" id="asCat"><option value="">Todas las categorías</option>${cats.map(k=>`<option>${esc(k)}</option>`).join("")}</select>` : ""}
    </div><div class="tiles stg" id="asTiles"></div>`;
  const pintar = ()=>{
    const q = $("#asQ").value.trim().toLowerCase(), cat = $("#asCat") ? $("#asCat").value : "";
    const l = todos.filter(s=> (!cat || (s.categoria||"").trim() === cat) && (!q || [s.nombre, s.precio, durTxt(s.duracion_minutos)].join(" ").toLowerCase().includes(q)));
    $("#asTiles").innerHTML = `<button class="tile add" id="asNew" style="--i:0">${IC.plus}Nuevo servicio</button>` +
      l.map((s,i)=> tileHtml(s, false, i+1, s.activo ? "" : "dim").replace('<span class="tick">', s.activo ? '<span class="tick">' : '<span class="badge" style="z-index:2">Oculto</span><span class="tick">')).join("");
    $("#asNew").onclick = ()=> hojaServicio(null, cats);
    $$("[data-tile]", box).forEach(b=> b.onclick = ()=> hojaServicio(todos.find(s=> String(s.id) === b.dataset.tile), cats));
  };
  $("#asQ").oninput = pintar; if($("#asCat")) $("#asCat").onchange = pintar;
  pintar();
}
function hojaServicio(s, cats=[]){
  const nuevo = !s;
  s = s || {nombre:"", descripcion:"", categoria:"", precio:"", duracion_minutos:30, foto_url:"", activo:true, orden:S.servicios.length};
  const durs = [...new Set([15,20,30,40,45,60,75,90,120,150,180, Number(s.duracion_minutos)||30])].sort((a,b)=> a-b);
  openSheet(`<h3>${nuevo ? "Nuevo servicio" : "Editar servicio"}</h3><p class="sub">Así aparece en la página y al agendar.</p>
    <div class="field"><label>Nombre</label><input id="fsNom" value="${esc(s.nombre)}" placeholder="Ej. Corte + barba"></div>
    <div class="field"><label>Descripción corta</label><input id="fsDes" value="${esc(s.descripcion||"")}" placeholder="Ej. Incluye toalla caliente"></div>
    <div class="grid2">
      <div class="field"><label>Precio (Q)</label><input id="fsPre" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(s.precio)}"></div>
      <div class="field"><label>Duración</label><select id="fsDur">${durs.map(m=>`<option value="${m}" ${m===Number(s.duracion_minutos)?"selected":""}>${durTxt(m)}</option>`).join("")}</select></div>
      <div class="field"><label>Categoría (opcional)</label><input id="fsCat" list="fsCats" value="${esc(s.categoria||"")}" placeholder="Ej. Cortes"><datalist id="fsCats">${cats.map(k=>`<option value="${esc(k)}">`).join("")}</datalist></div>
      <div class="field"><label>Orden en la lista</label><input id="fsOrd" type="number" value="${Number(s.orden)||0}"></div>
    </div>
    ${imgField("fsFoto", "Foto (opcional)", s.foto_url)}
    <div class="sw-row"><div>Visible para clientes<small>Si lo apagas, se oculta sin borrarlo.</small></div><label class="sw"><input type="checkbox" id="fsAct" ${s.activo?"checked":""}><span></span></label></div>
    <div class="sh-actions">${nuevo ? "" : `<button class="pill pill-ghost danger-txt" id="fsDel">${IC.trash} Eliminar</button>`}<button class="pill pill-white" id="fsOk">Guardar</button></div>`, sh=>{
    cablearFotos(sh);
    $("#fsOk",sh).onclick = async ()=>{
      const row = {nombre: $("#fsNom",sh).value.trim(), descripcion: $("#fsDes",sh).value.trim(), precio: Number($("#fsPre",sh).value), duracion_minutos: Number($("#fsDur",sh).value), categoria: $("#fsCat",sh).value.trim(), orden: Number($("#fsOrd",sh).value)||0, foto_url: $("#fsFoto",sh).value.trim(), activo: $("#fsAct",sh).checked};
      if(!row.nombre) return toast("Falta el nombre");
      if(!(row.precio >= 0) || $("#fsPre",sh).value === "") return toast("Revisa el precio");
      let r = nuevo ? await sb.from("servicios").insert(row) : await sb.from("servicios").update(row).eq("id", s.id);
      if(r.error && /categoria/.test(r.error.message||"")){ delete row.categoria; r = nuevo ? await sb.from("servicios").insert(row) : await sb.from("servicios").update(row).eq("id", s.id); }
      if(r.error) return toast("No se pudo guardar");
      closeSheet(); toast(nuevo ? "Servicio creado" : "Servicio actualizado"); await cargarDatosBase(); if(S.adminTab !== "servicios") irTab("servicios"); else pintarTab();
    };
    const del = $("#fsDel",sh);
    if(del) del.onclick = async ()=>{
      const {error} = await sb.from("servicios").delete().eq("id", s.id);
      if(error) return toast("Tiene citas registradas: mejor apágalo para ocultarlo");
      closeSheet(); toast("Servicio eliminado"); await cargarDatosBase(); pintarTab();
    };
  });
}

async function tabHorario(box){
  const [{data:hor}, {data:bl}] = await Promise.all([sb.from("horarios").select("*").order("dia_semana"), sb.from("bloqueos").select("*").gte("fecha", isoDate(new Date())).order("fecha")]);
  box.innerHTML = `<div class="fcard"><h3>Días y horas de atención</h3><p>El intervalo define cada cuánto aparecen horarios para agendar. La duración real de la cita la pone cada servicio.</p>
    ${[1,2,3,4,5,6,0].map(d=>{ const h = (hor||[]).find(x=> x.dia_semana === d) || {activo:false, hora_inicio:"09:00", hora_fin:"18:00", intervalo_minutos:30}; const iv = Number(h.intervalo_minutos)||30;
      return `<div class="dr ${h.activo?"":"off"}" data-dia="${d}" style="background:var(--card-2)">
        <label class="sw"><input type="checkbox" class="dAct" ${h.activo?"checked":""} aria-label="${DIAS[d]} abierto"><span></span></label>
        <span class="dr-n">${DIAS[d]}</span>
        <div class="dr-t"><input type="time" class="dIni" value="${hhmm(h.hora_inicio)}"> a <input type="time" class="dFin" value="${hhmm(h.hora_fin)}">
          <div class="segc">${[15,30,60].map(v=>`<button type="button" data-v="${v}" class="${iv===v?"on":""}">${v===60?"1 h":v+" min"}</button>`).join("")}</div></div>
      </div>`; }).join("")}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="pill pill-white" id="hrOk">Guardar horario</button></div></div>

    <div class="fcard"><h3>Bloqueos</h3><p>Vacaciones, feriados o un rato libre. Esos horarios dejan de ofrecerse.</p>
      <div class="grid2">
        <div class="field"><label>Fecha</label><input type="date" id="blF" min="${isoDate(new Date())}"></div>
        <div class="field"><label>Motivo</label><input id="blM" placeholder="Ej. Vacaciones"></div>
      </div>
      <div class="sw-row" style="border:0;padding-top:0"><div>Todo el día</div><label class="sw"><input type="checkbox" id="blTodo" checked><span></span></label></div>
      <div class="grid2 hidden" id="blHoras"><div class="field"><label>Desde</label><input type="time" id="blI"></div><div class="field"><label>Hasta</label><input type="time" id="blFi"></div></div>
      <button class="pill pill-ghost pill-sm" id="blOk">${IC.plus} Agregar bloqueo</button>
      <div style="margin-top:16px">${(bl||[]).map(b=>`<div class="cl-row" style="background:var(--card-2);cursor:default"><span class="av">${IC.block}</span><div class="ci"><b>${fmtFechaLarga(b.fecha)}</b><span>${b.todo_el_dia ? "Todo el día" : hhmm(b.hora_inicio)+" – "+hhmm(b.hora_fin)}${b.motivo ? " · "+esc(b.motivo) : ""}</span></div><button class="circ danger" data-delb="${b.id}" aria-label="Quitar bloqueo">${IC.trash}</button></div>`).join("") || `<p class="side-sub" style="margin:0">Sin bloqueos próximos.</p>`}</div>
    </div>`;
  $$(".dr", box).forEach(r=>{
    $(".dAct", r).onchange = e=> r.classList.toggle("off", !e.target.checked);
    $(".segc", r).onclick = e=>{ const b = e.target.closest("[data-v]"); if(!b) return; $$(".segc button", r).forEach(x=> x.classList.toggle("on", x === b)); };
  });
  $("#hrOk").onclick = async ()=>{
    const filas = $$(".dr", box).map(r=> ({dia_semana: Number(r.dataset.dia), activo: $(".dAct",r).checked, hora_inicio: $(".dIni",r).value || "09:00", hora_fin: $(".dFin",r).value || "18:00", intervalo_minutos: Number(($(".segc .on",r)||{dataset:{v:30}}).dataset.v)}));
    if(filas.some(f=> f.activo && toMin(f.hora_fin) <= toMin(f.hora_inicio))) return toast("Revisa: la hora de cierre debe ser después de la apertura");
    const {error} = await sb.from("horarios").upsert(filas, {onConflict:"dia_semana"});
    if(error) return toast("No se pudo guardar el horario");
    toast("Horario guardado"); await cargarDatosBase();
  };
  $("#blTodo").onchange = e=> $("#blHoras").classList.toggle("hidden", e.target.checked);

    if(!todo && (!$("#blI").value || !$("#blFi").value)) return toast("Indica desde y hasta");
    await sb.from("bloqueos").insert({fecha, todo_el_dia: todo, hora_inicio: todo ? null : $("#blI").value, hora_fin: todo ? null : $("#blFi").value, motivo: $("#blM").value.trim()});
    toast("Bloqueo agregado"); await cargarDatosBase(); pintarTab();
  };
  $$("[data-delb]", box).forEach(b=> b.onclick = async ()=>{ await sb.from("bloqueos").delete().eq("id", b.dataset.delb); await cargarDatosBase(); pintarTab(); });
}

      <div class="sw-row" style="border:0"><div>Códigos de referido</div><label class="sw"><input type="checkbox" id="ajRef" ${c.referidos_activo?"checked":""}><span></span></label></div>
    </div>
    <div class="qr-card"><img src="${qrUrl(link)}" alt="QR para agendar"><div><b>QR para agendar</b><p>Para tu vitrina, tarjetas o redes: abre directo la reserva.</p><a class="pill pill-ghost pill-sm" href="${qrUrl(link, 900)}" target="_blank" rel="noopener">Abrir para imprimir</a></div></div>
    <div class="save-bar"><button class="pill pill-white" id="ajOk">Guardar ajustes</button></div>`;
  $("#ajOk").onclick = async ()=>{
    const base = {nombre: $("#ajNom").value.trim() || "Imperio Store Barber", direccion: $("#ajDir").value.trim(), maps_link: $("#ajMaps").value.trim(), whatsapp: soloDigitos($("#ajWa").value),
      fidelidad_activa: $("#ajFid").checked, puntos_por_visita: Math.max(1, Number($("#ajPV").value)||1), puntos_para_premio: Math.max(1, Number($("#ajPP").value)||10), referidos_activo: $("#ajRef").checked};
    const extra = {msg_recordatorio: $("#ajMR").value.trim(), msg_espera: $("#ajME").value.trim(), premio_texto: $("#ajPr").value.trim()};
    let {error} = await sb.from("config_negocio").update({...base, ...extra}).eq("id", 1);
    if(error) ({error} = await sb.from("config_negocio").update(base).eq("id", 1));
    if(error) return toast("No se pudo guardar");
    toast("Ajustes guardados"); await cargarDatosBase(); pintarMarco();
  };
}

/* ---------------- fotos: subir a Supabase Storage ---------------- */
function imgField(id, label, val){
  return `<div class="field"><label>${label}</label><div class="imgf">
    <div class="imgf-prev" id="${id}Prev" style="${val ? `background-image:url('${esc(val)}')` : ""}">${val ? "" : IC.image}</div>
    <div class="imgf-r"><input id="${id}" value="${esc(val||"")}" placeholder="Pega un link o sube una foto">
      <label class="pill pill-ghost pill-sm upl">${IC.upload} Subir foto<input type="file" accept="image/*" data-upload="${id}" hidden></label></div>
  </div></div>`;
}
function cablearFotos(root){
  $$("[data-upload]", root).forEach(inp=> inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const id = inp.dataset.upload, lbl = inp.parentElement, txt = lbl.innerHTML;
    lbl.style.pointerEvents = "none"; lbl.firstChild && (lbl.childNodes[1].textContent = " Subiendo…");
    const url = await subirImagen(f);
    lbl.style.pointerEvents = ""; lbl.innerHTML = txt; cablearFotos(root);
    if(url){ $("#"+id, root).value = url; pintarPrev(root, id, url); toast("Foto lista. No olvides guardar."); }
  });
  $$(".imgf-r > input", root).forEach(i=> i.oninput = ()=> pintarPrev(root, i.id, i.value.trim()));
}
function pintarPrev(root, id, url){ const p = $("#"+id+"Prev", root); if(!p) return; p.style.backgroundImage = url ? `url('${url.replace(/'/g,"%27")}')` : ""; p.innerHTML = url ? "" : IC.image; }
async function comprimir(file, max=1600){
  if(!/image\/(jpeg|png|webp)/.test(file.type) || !window.createImageBitmap) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if(k === 1 && file.size < 900000) return file;
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const png = file.type === "image/png";
    const blob = await new Promise(r=> cv.toBlob(r, png ? "image/png" : "image/jpeg", .86));
    return blob ? new File([blob], png ? "foto.png" : "foto.jpg", {type: blob.type}) : file;
  }catch(e){ return file; }
}
async function subirImagen(file){
  if(file.size > 15*1024*1024){ toast("La foto es muy pesada (máx. 15 MB)"); return null; }
  const f = await comprimir(file);
  const ext = f.type === "image/png" ? "png" : f.type === "image/webp" ? "webp" : "jpg";
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error} = await sb.storage.from("imagenes").upload(path, f, {cacheControl:"31536000", upsert:false, contentType:f.type});
  if(error){ console.error(error); toast("No se pudo subir. ¿Creaste el bucket “imagenes”? (ver SQL)"); return null; }
  return sb.storage.from("imagenes").getPublicUrl(path).data.publicUrl;
}
