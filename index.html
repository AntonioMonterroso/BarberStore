<!--
==========================================================================================
 IMPERIO STORE BARBER — BASE DE DATOS (SUPABASE)
 A) Proyecto NUEVO: ejecuta la sección A completa en el SQL Editor.
 B) Si ya ejecutaste una versión anterior: ejecuta SOLO la sección B (migración v3).
==========================================================================================

----------------------------------------- A) ESQUEMA COMPLETO ----------------------------

create extension if not exists "pgcrypto";

create table config_negocio (
  id int primary key default 1,
  nombre text default 'Imperio Store Barber',
  direccion text default '',
  maps_link text default '',
  whatsapp text default '',
  fidelidad_activa boolean default false,
  puntos_por_visita int default 1,
  puntos_para_premio int default 10,
  referidos_activo boolean default true,
  constraint single_row check (id = 1)
);
insert into config_negocio (id) values (1);

create table horarios (
  id serial primary key,
  dia_semana int not null unique,           -- 0=domingo ... 6=sábado
  activo boolean default false,
  hora_inicio time default '09:00',
  hora_fin time default '18:00',
  intervalo_minutos int default 30
);
insert into horarios (dia_semana, activo) values (0,false),(1,true),(2,true),(3,true),(4,true),(5,true),(6,true);

create table bloqueos (
  id serial primary key,
  fecha date not null,
  hora_inicio time,
  hora_fin time,
  todo_el_dia boolean default true,
  motivo text
);

create table servicios (
  id serial primary key,
  nombre text not null,
  descripcion text default '',
  precio numeric(10,2) not null default 0,
  duracion_minutos int not null default 30,
  foto_url text default '',
  activo boolean default true,
  orden int default 0
);

create table estilos_corte (
  id serial primary key,
  nombre text not null,
  categoria text default '',
  foto_url text default '',
  activo boolean default true,
  orden int default 0
);

create table clientes (
  id uuid primary key default gen_random_uuid(),
  nombre text not null,
  telefono text not null unique,
  estilo_preferido_id int references estilos_corte(id) on delete set null,
  notas text default '',
  puntos_actuales int default 0,
  codigo_referido text unique,
  referido_por uuid references clientes(id),
  creado_en timestamptz default now()
);

create table citas (
  id uuid primary key default gen_random_uuid(),
  cliente_id uuid references clientes(id),
  servicio_id int references servicios(id),
  estilo_id int references estilos_corte(id) on delete set null,
  fecha date not null,
  hora_inicio time not null,
  hora_fin time not null,
  estado text default 'confirmada',          -- confirmada | completada | cancelada | no_asistio
  notas text default '',
  creado_en timestamptz default now()
);

create table waitlist (
  id uuid primary key default gen_random_uuid(),
  cliente_id uuid references clientes(id),
  fecha_deseada date not null,
  hora_desde time,
  hora_hasta time,
  estado text default 'esperando',           -- esperando | notificado | tomado | expirado
  creado_en timestamptz default now()
);

create table resenas (
  id uuid primary key default gen_random_uuid(),
  cita_id uuid references citas(id) on delete set null,
  calificacion int check (calificacion between 1 and 5),
  comentario text default '',
  creado_en timestamptz default now()
);

alter table config_negocio enable row level security;
alter table horarios enable row level security;
alter table bloqueos enable row level security;
alter table servicios enable row level security;
alter table estilos_corte enable row level security;
alter table clientes enable row level security;
alter table citas enable row level security;
alter table waitlist enable row level security;
alter table resenas enable row level security;

create policy "lectura publica config" on config_negocio for select using (true);
create policy "lectura publica horarios" on horarios for select using (true);
create policy "lectura publica bloqueos" on bloqueos for select using (true);
create policy "lectura publica servicios" on servicios for select using (true);
create policy "lectura publica estilos" on estilos_corte for select using (true);
create policy "lectura publica citas" on citas for select using (true);
create policy "lectura publica resenas" on resenas for select using (true);
create policy "insert publico clientes" on clientes for insert with check (true);
create policy "select publico clientes" on clientes for select using (true);
create policy "update publico clientes" on clientes for update using (true);
create policy "insert publico citas" on citas for insert with check (true);
create policy "update publico citas" on citas for update using (true);
create policy "insert publico waitlist" on waitlist for insert with check (true);
create policy "select publico waitlist" on waitlist for select using (true);
create policy "insert publico resenas" on resenas for insert with check (true);
create policy "admin full config" on config_negocio for all using (auth.role() = 'authenticated');
create policy "admin full horarios" on horarios for all using (auth.role() = 'authenticated');
create policy "admin full bloqueos" on bloqueos for all using (auth.role() = 'authenticated');
create policy "admin full servicios" on servicios for all using (auth.role() = 'authenticated');
create policy "admin full estilos" on estilos_corte for all using (auth.role() = 'authenticated');
create policy "admin full waitlist" on waitlist for all using (auth.role() = 'authenticated');

-- (Después de la sección A, ejecuta también la sección B completa.)

----------------------------------------- B) MIGRACIÓN v3 --------------------------------

alter table config_negocio
  add column if not exists hero_eyebrow text default '',
  add column if not exists hero_titulo text default '',
  add column if not exists hero_subtitulo text default '',
  add column if not exists hero_imagen_url text default '',
  add column if not exists hero_recorte boolean default false,
  add column if not exists barbero_nombre text default '',
  add column if not exists barbero_titulo text default '',
  add column if not exists barbero_frase text default '',
  add column if not exists barbero_bio text default '',
  add column if not exists barbero_foto_url text default '',
  add column if not exists anios_experiencia text default '',
  add column if not exists clientes_atendidos text default '',
  add column if not exists maps_embed_url text default '',
  add column if not exists instagram text default '',
  add column if not exists facebook text default '',
  add column if not exists tiktok text default '',
  add column if not exists mostrar_galeria boolean default true,
  add column if not exists mostrar_resenas boolean default true,
  add column if not exists frase_cierre text default '',
  add column if not exists premio_texto text default '',
  add column if not exists msg_recordatorio text default '',
  add column if not exists msg_espera text default '';

alter table servicios add column if not exists categoria text default '';
alter table resenas add column if not exists nombre text default '';

drop policy if exists "admin full resenas" on resenas;
create policy "admin full resenas" on resenas for all using (auth.role() = 'authenticated');

-- Fotos: bucket público "imagenes" (el panel sube aquí las fotos de servicios, estilos y portada)
insert into storage.buckets (id, name, public) values ('imagenes','imagenes', true)
  on conflict (id) do nothing;
drop policy if exists "imagenes lectura publica" on storage.objects;
create policy "imagenes lectura publica" on storage.objects for select using (bucket_id = 'imagenes');
drop policy if exists "imagenes admin sube" on storage.objects;
create policy "imagenes admin sube" on storage.objects for insert with check (bucket_id = 'imagenes' and auth.role() = 'authenticated');
drop policy if exists "imagenes admin borra" on storage.objects;
create policy "imagenes admin borra" on storage.objects for delete using (bucket_id = 'imagenes' and auth.role() = 'authenticated');

-- Blindaje contra citas duplicadas: la base de datos rechaza dos citas que se traslapen,
-- aunque dos clientes confirmen el mismo horario al mismo segundo.
-- (Si falla, es porque ya existen citas traslapadas: corrígelas y vuelve a ejecutar.)
alter table citas drop constraint if exists citas_sin_traslape;
alter table citas add constraint citas_sin_traslape
  exclude using gist (tsrange(fecha + hora_inicio, fecha + hora_fin) with &&)
  where (estado in ('confirmada','completada'));

-- Por último: crea tu usuario del panel en Authentication > Users (correo + contraseña).

NOTA: "Mis citas" busca por número de teléfono sin contraseña (mínima fricción para el cliente).
Quien conozca el teléfono de un cliente podría ver o cancelar su cita. Es el mismo riesgo que
aceptan la mayoría de sistemas de barbería; cerrarlo del todo requiere verificación por código
de WhatsApp desde un backend.
==========================================================================================
-->
<style>
:root{
  --bg:#101012; --bg-2:#161619; --card:#1c1c20; --card-2:#26262b; --card-3:#323238;
  --cream:#f3efe7; --text-2:#a3a09a; --text-3:#6f6c68;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --copper:#c98a3e; --copper-2:#e1a95f; --amber:#f5a623;
  --ok:#5ec27a; --danger:#ff5a4f;
  --r-xl:28px; --r-lg:20px; --r:14px;
  --disp:'Anton','Oswald','Impact',sans-serif;
  --ui:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
svg{width:18px;height:18px;flex:0 0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--copper);color:#140d05}
:focus-visible{outline:2px solid var(--copper-2);outline-offset:3px;border-radius:6px}
.copper{color:var(--copper-2)}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,194,122,.5)}70%{box-shadow:0 0 0 9px rgba(94,194,122,0)}100%{box-shadow:0 0 0 0 rgba(94,194,122,0)}}

/* ---------- carga ---------- */
.boot{min-height:100svh;display:grid;place-items:center}
.boot img{width:110px;opacity:.9;animation:bootP 1.6s ease-in-out infinite}
@keyframes bootP{50%{opacity:.35;transform:scale(.96)}}

/* ---------- header ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:background .4s,border-color .4s}
#hdr.solid{background:rgba(16,16,18,.8);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-color:var(--line)}
.hdr-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}
.brand img{width:40px;height:40px;object-fit:contain}
.brand span{font-family:var(--disp);font-size:19px;letter-spacing:.05em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--ui);font-size:8.5px;letter-spacing:.32em;color:var(--text-2);margin-top:4px;font-weight:700}
.hdr-nav{display:none;gap:2px}
.hdr-nav button{padding:9px 14px;border-radius:999px;font-size:14px;color:var(--text-2);font-weight:600;transition:color .25s,background .25s}
.hdr-nav button:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-social{display:none;gap:2px;margin-right:4px}
.hdr-social a{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--text-2);transition:color .25s,background .25s}
.hdr-social a:hover{color:var(--cream);background:rgba(255,255,255,.06)}
.burger{width:42px;height:42px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{width:16px;height:1.6px;border-radius:2px;background:var(--cream);transition:transform .4s var(--ease)}
body.menu-open .burger span:first-child{transform:translateY(3.3px) rotate(45deg)}
body.menu-open .burger span:last-child{transform:translateY(-3.3px) rotate(-45deg)}
.lg-only{display:none}
@media(min-width:1000px){.hdr-nav,.hdr-social{display:flex}.burger{display:none}.lg-only{display:inline}}
body[data-route=admin] .hdr-nav,body[data-route=admin] .hdr-social,body[data-route=admin] #hdr [data-reservar]{display:none}

.menu-ov{position:fixed;inset:0;z-index:45;background:rgba(12,12,14,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;padding:110px 26px 40px;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
body.menu-open{overflow:hidden}
body.menu-open .menu-ov{opacity:1;visibility:visible}
.menu-ov nav{display:flex;flex-direction:column;gap:4px}
.menu-ov nav button{text-align:left;font-family:var(--disp);font-size:clamp(42px,12vw,70px);text-transform:uppercase;line-height:1.05;display:flex;align-items:baseline;gap:14px;opacity:0;transform:translateY(34px);transition:transform .7s var(--ease),opacity .6s,color .25s;transition-delay:0s}
.menu-ov nav button i{font-family:var(--ui);font-style:normal;font-size:12px;font-weight:700;color:var(--copper-2);letter-spacing:.12em}
.menu-ov nav button:hover{color:var(--copper-2)}
body.menu-open .menu-ov nav button{opacity:1;transform:none;transition-delay:calc(var(--i)*70ms + 120ms)}
.menu-foot{margin-top:44px;display:flex;gap:10px;flex-wrap:wrap;opacity:0;transition:opacity .6s .5s}
body.menu-open .menu-foot{opacity:1}

/* ---------- botones ---------- */
.pill{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;transition:transform .35s var(--ease),background .25s,box-shadow .35s,opacity .25s,color .25s}
.pill svg{transition:transform .35s var(--ease)}
.pill:hover svg{transform:translateX(3px)}
.pill:active{transform:scale(.97)}
.pill-white{background:var(--cream);color:#111}
.pill-white:hover{background:#fff;box-shadow:0 14px 34px -12px rgba(243,239,231,.4)}
.pill-black{background:#111;color:var(--cream)}
.pill-black:hover{background:#000}
.pill-ghost{color:var(--cream);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill-ghost:hover{box-shadow:inset 0 0 0 1px var(--cream)}
.pill-copper{background:var(--copper);color:#140d05}
.pill-sm{height:40px;padding:0 18px;font-size:13.5px}
.pill-lg{height:64px;padding:0 36px;font-size:16.5px}
.pill-block{display:flex;width:100%}
.pill[disabled]{opacity:.35;pointer-events:none}
.danger-txt{color:var(--danger)!important}
.circ{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);transition:background .25s,transform .3s var(--ease);flex:0 0 auto}
.circ:hover{background:var(--card-2)}
.circ:active{transform:scale(.94)}
.circ.danger{color:var(--danger)}
.link-btn{color:var(--text-2);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line-2);transition:color .25s}
.link-btn:hover{color:var(--cream)}

/* ---------- HERO (referencia: The Gentleman's Club) ---------- */
.hx{position:relative;min-height:100svh;padding:118px 0 70px;overflow:hidden;
  background:radial-gradient(ellipse 85% 70% at 38% 45%,#2a2f2c 0%,#1b1d1c 48%,var(--bg) 100%)}
.hx::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hx-glow{position:absolute;width:70vw;height:70vw;max-width:900px;max-height:900px;left:8%;top:6%;border-radius:50%;background:radial-gradient(circle,rgba(201,138,62,.14),transparent 62%);pointer-events:none;animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate(14%,10%) scale(1.12)}}
.hx-in{position:relative;max-width:1320px;margin:0 auto;padding:0 20px}
.hx-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;position:relative;z-index:3;animation:fadeUp .8s var(--ease) .1s both}
.chip-status{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip-status svg{width:13px;height:13px;color:var(--amber)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.dot.on{background:var(--ok);animation:pulse 2s infinite}
.hx-title{position:relative;z-index:1;margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(64px,19vw,122px);line-height:.88;letter-spacing:-.005em;will-change:transform}
.hx-title .ln{display:block;overflow:hidden;padding:.02em 0 .05em}
.hx-title .ln.r{text-align:right}
.hx-title .ln>span{display:inline-block;transform:translateY(108%);animation:lnUp 1.15s var(--ease) var(--d) forwards}
.hx-title em{font-style:normal;color:var(--copper-2)}
@keyframes lnUp{to{transform:none}}
.hx-fig{position:relative;z-index:0;margin:-6vw auto 0;animation:figIn 1.5s var(--ease) .35s both}
.hx-fig .par{will-change:transform}
@keyframes figIn{from{opacity:0;transform:translateY(46px) scale(.97)}to{opacity:1;transform:none}}
.hx-fig.cut{z-index:2;width:min(92%,520px)}
.hx-fig.cut img{width:100%;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.hx-fig.photo{width:100%;margin-top:22px}
.hx-fig.photo img{width:100%;aspect-ratio:4/5;max-height:72svh;object-fit:cover;border-radius:var(--r-xl);filter:brightness(.82) contrast(1.05)}
.hx-fig.logo{position:absolute;z-index:0;top:40px;right:-14%;width:82%;margin:0;pointer-events:none}
.hx-fig.logo img{width:100%;opacity:.09}
.hx-logo-badge{width:84px;margin-bottom:18px;opacity:.95;animation:fadeUp .9s var(--ease) .6s both}
.hx-side{position:relative;z-index:3;margin-top:30px}
.hx-sub{color:var(--text-2);font-size:16px;line-height:1.7;margin:0 0 20px;max-width:440px;animation:fadeUp .9s var(--ease) .75s both}
.svc-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line-2);text-align:left;position:relative;animation:fadeUp .8s var(--ease) both;animation-delay:calc(.9s + var(--i)*70ms)}
.svc-row .nm{font-size:clamp(17px,1.6vw,20px);font-weight:500;letter-spacing:-.01em;transition:transform .5s var(--ease),color .3s}
.svc-row .nm small{display:block;font-size:12px;color:var(--text-3);margin-top:3px;font-weight:600}
.svc-row .rt{display:grid;align-items:center;justify-items:end;height:40px;overflow:hidden;flex:0 0 auto}
.svc-row .pr,.svc-row .bk{grid-area:1/1}
.svc-row .pr{font-family:var(--disp);font-size:25px;letter-spacing:.01em;transition:transform .5s var(--ease),opacity .35s}
.svc-row .bk{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;background:var(--copper);color:#140d05;font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.03em;border-radius:3px;transform:translateY(110%);transition:transform .5s var(--ease)}
.svc-row .bk svg{width:17px;height:17px}
.svc-row::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--copper);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
@media(hover:hover){
  .svc-row:hover .pr{transform:translateY(-110%);opacity:0}
  .svc-row:hover .bk{transform:none}
  .svc-row:hover .nm{transform:translateX(6px)}
  .svc-row:hover::after{transform:scaleX(1)}
}
.hx-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px;animation:fadeUp .9s var(--ease) 1.3s both}
.hx-scroll{position:absolute;left:50%;bottom:18px;z-index:3;display:none;flex-direction:column;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--text-3);transform:translateX(-50%)}
.hx-scroll i{width:1px;height:40px;background:linear-gradient(var(--copper),transparent);animation:cue 2.4s var(--ease) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

@media(min-width:900px){
  .hx-in{min-height:calc(100svh - 188px);display:flex;flex-direction:column}
  .hx-title{font-size:clamp(96px,15.2vw,228px)}
  .hx-fig{position:absolute;margin:0;left:20px;top:clamp(120px,12vw,210px)}
  .hx-fig.cut{width:min(46%,640px)}
  .hx-fig.photo{width:min(40%,540px)}
  .hx-fig.photo img{max-height:calc(100svh - 230px)}
  .hx-fig.logo{width:min(56%,780px);left:-5%;right:auto;top:70px}
  .hx-side{margin-left:auto;width:min(470px,41%);margin-top:34px}
  .hx-scroll{display:flex}
}

/* ---------- marquesina ---------- */
.mq{position:relative;overflow:hidden;border-block:1px solid var(--line);padding:24px 0;background:var(--bg)}
.mq-track{display:flex;align-items:center;width:max-content;animation:mq 45s linear infinite}
.mq span{font-family:var(--disp);font-size:clamp(36px,5.5vw,70px);text-transform:uppercase;line-height:1;padding:0 26px;color:transparent;-webkit-text-stroke:1px rgba(243,239,231,.32);white-space:nowrap}
.mq span:nth-of-type(3n+1){color:var(--cream);-webkit-text-stroke:0}
.mq b{color:var(--copper);font-size:22px}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- secciones ---------- */
.sec{max-width:1320px;margin:0 auto;padding:110px 20px 0;scroll-margin-top:70px}
.sec-head{margin-bottom:34px}
.sec-head.row{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--copper-2);margin-bottom:14px}
.kicker::before{content:"";width:24px;height:1px;background:currentColor}
.h-xl{font-family:var(--disp);font-weight:400;font-size:clamp(48px,8vw,108px);line-height:.92;margin:0;letter-spacing:-.005em}
.h-xl em,.h-giant em{font-style:normal;color:var(--copper-2)}
.reveal{opacity:0;transform:translateY(34px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal[data-d="1"]{transition-delay:.1s}.reveal[data-d="2"]{transition-delay:.2s}.reveal[data-d="3"]{transition-delay:.3s}

/* ---------- barbero + reserva rápida (referencia: Black Box) ---------- */
.pro-grid{display:grid;grid-template-columns:1fr;gap:16px}
.pro-grid>*,.loc-grid>*,.hx-side,.book-card{min-width:0}
@media(min-width:980px){.pro-grid{grid-template-columns:.82fr 1.18fr;align-items:start}}
.pro-card{background:var(--card);border-radius:var(--r-xl);overflow:hidden}
.pro-photo{position:relative;aspect-ratio:1/1.05;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2c2c31,var(--card) 72%)}
.pro-photo img.ph{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.pro-card:hover .pro-photo img.ph{transform:scale(1.04)}
.pro-photo img.lg{width:56%;margin:12% auto 0;opacity:.9}
.pro-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(28,28,32,.55) 68%,var(--card) 100%)}
.pro-id{position:absolute;left:24px;right:24px;bottom:18px}
.pro-id h3{font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;margin:0 0 8px;line-height:1.1}
.pro-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.rate{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--text-2)}
.rate svg{width:14px;height:14px;color:var(--amber)}
.tag-c{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-2)}
.pro-bio{padding:6px 24px 0;margin:0;color:var(--text-2);line-height:1.7;font-size:14.5px}
.pro-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 24px 24px;border-radius:var(--r-lg);background:var(--bg-2);overflow:hidden}
.pro-stats div{padding:16px 6px;text-align:center}
.pro-stats div+div{border-left:1px solid var(--line)}
.pro-stats b{display:block;font-family:var(--disp);font-size:31px;font-weight:400;line-height:1}
.pro-stats span{display:block;font-size:11px;color:var(--text-3);margin-top:7px;font-weight:700;letter-spacing:.06em}
.book-card{background:var(--card);border-radius:var(--r-xl);padding:22px}
@media(min-width:600px){.book-card{padding:28px}}
.seg{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:42px;padding:0 20px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:700;color:var(--text-2);transition:all .35s var(--ease);white-space:nowrap}
.seg button:hover{color:var(--cream)}
.seg button.on{background:var(--cream);color:#111;box-shadow:none}
.pbody{animation:rise .45s var(--ease) both}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin:0 0 12px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar,.date-row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:999px;background:var(--card-2);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--text-2);transition:all .3s var(--ease)}
.chip:hover{color:var(--cream)}
.chip.on{background:var(--cream);color:#111}
.month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-row span{font-weight:800;font-size:20px;letter-spacing:-.02em;text-transform:capitalize}
.month-row .circ{width:38px;height:38px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.date-row{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 8px;margin-bottom:20px;scrollbar-width:none}
.dchip{flex:0 0 auto;width:62px;height:78px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .4s var(--ease),background .3s,box-shadow .3s}
.dchip b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.dchip span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.dchip:hover{box-shadow:inset 0 0 0 1px var(--text-3)}
.dchip.on{background:var(--cream);color:#111;box-shadow:none;transform:translateY(-3px)}
.dchip.on span{color:#666}
.dchip.off{opacity:.25;pointer-events:none}
.time-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tpill{height:44px;min-width:80px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:700;transition:all .3s var(--ease)}
.tpill:hover{box-shadow:inset 0 0 0 1px var(--text-2)}
.tpill.on{background:var(--cream);color:#111;box-shadow:none;transform:translateY(-2px)}
.tpill.taken{opacity:.28;text-decoration:line-through;pointer-events:none}
.empty-note{width:100%;padding:18px;border-radius:var(--r-lg);background:var(--bg-2);color:var(--text-2);font-size:14px;line-height:1.6}
.qb-summary{background:var(--cream);color:#111;border-radius:22px;padding:14px 14px 14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:opacity .4s}
.qb-summary:not(.ready){opacity:.5}
.qs-l{display:flex;align-items:center;gap:12px;min-width:0}
.qs-l svg{width:20px;height:20px}
.qs-l b{display:block;font-size:15px;font-weight:800}
.qs-l span{display:block;font-size:13px;color:#555;margin-top:2px}
.qs-r{display:flex;align-items:center;gap:14px;margin-left:auto}
.qs-price{font-family:var(--disp);font-size:25px}
.port-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.port-grid{grid-template-columns:repeat(3,1fr)}}
.port-item{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--card-2);text-align:left;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.port-item img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.port-item:hover img{transform:scale(1.07)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.86))}
.cap span{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-2)}
.cap b{display:block;font-size:16px;font-weight:700;margin-top:3px}
.ph-empty{width:100%;height:100%;display:grid;place-items:center;color:var(--text-3)}
.ph-empty svg{width:30px;height:30px}
.rv-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.rv-head>b{font-family:var(--disp);font-size:58px;font-weight:400;line-height:1}
.rv-head span{display:block;font-size:13px;color:var(--text-2);margin-top:5px}
.rv-list{display:flex;flex-direction:column;gap:10px;max-height:480px;overflow:auto;padding-right:4px}
.rv{background:var(--bg-2);border-radius:var(--r-lg);padding:18px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.rv-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rv-top b{display:block;font-size:14.5px;font-weight:700;margin-bottom:3px}
.av{width:40px;height:40px;border-radius:50%;background:var(--card-3);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto;text-transform:uppercase}
.rv p{margin:0;color:var(--text-2);line-height:1.6;font-size:14.5px}
.stars{display:inline-flex;gap:2px;color:var(--amber);vertical-align:middle}
.stars svg{width:13px;height:13px}
.stars .off{color:var(--card-3)}

/* ---------- mosaico de servicios (referencia: POS iPad) ---------- */
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:14px;background:var(--card);flex:0 1 420px;min-width:0;transition:box-shadow .25s}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--text-3)}
.search svg{color:var(--text-3)}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px;min-width:0;height:100%}
.search input::placeholder{color:var(--text-3)}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;min-height:132px;padding:18px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;text-align:left;transition:transform .45s var(--ease),background .3s,box-shadow .3s,color .3s}
.tile:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--line-2)}
.tile:active{transform:scale(.98)}
.tile-nm{font-weight:700;font-size:15.5px;line-height:1.3;padding-right:42px}
.tile-ds{font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.45}
.tile-ft{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:12.5px;color:var(--text-3)}
.tile-ft b{font-size:17px;color:var(--cream);font-weight:800}
.tile-img{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;object-fit:cover;transition:opacity .3s}
.tile .tick{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:#111;color:var(--cream);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease)}
.tile .tick svg{width:15px;height:15px}
.tile.on{background:var(--cream);color:#111;box-shadow:none}
.tile.on .tile-ft,.tile.on .tile-ds{color:#666}
.tile.on .tile-ft b{color:#111}
.tile.on .tick{transform:scale(1)}
.tile.on .tile-img{opacity:0}
.tile.dim{opacity:.45}
.tile.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);align-items:center;justify-content:center;color:var(--text-2);gap:10px;font-weight:700}
.tile.add:hover{color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--text-2)}
.tile .badge{position:absolute;top:14px;right:14px}
.stg>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}

/* barra inferior flotante (referencia: Black Box "Book now") */
.fbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:620px;margin:0 auto;background:rgba(30,30,34,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line-2);border-radius:26px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:14px;transform:translateY(150%);transition:transform .6s var(--ease);box-shadow:0 24px 60px -20px rgba(0,0,0,.85)}
.fbar.on{transform:none}
.fbar-i{min-width:0;flex:1}
.fbar-i b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar-i span{display:block;font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar-i.muted b{color:var(--text-2);font-weight:600}
.fbar .circ{width:40px;height:40px}

/* ---------- ubicación ---------- */
.loc-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){.loc-grid{grid-template-columns:1.35fr 1fr}}
.map-card{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--card);min-height:460px}
.map-card iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(1) invert(.9) contrast(.88)}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px}
.map-ph .pinb{width:56px;height:56px;border-radius:50%;background:var(--copper);display:grid;place-items:center;color:#140d05;margin-bottom:120px;animation:pinP 2.4s var(--ease) infinite}
.map-ph .pinb svg{width:24px;height:24px}
@keyframes pinP{0%{box-shadow:0 0 0 0 rgba(201,138,62,.45)}80%{box-shadow:0 0 0 30px rgba(201,138,62,0)}100%{box-shadow:0 0 0 0 rgba(201,138,62,0)}}
.map-over{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(22,22,25,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;padding:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.map-over h3{font-weight:800;font-size:22px;letter-spacing:-.02em;margin:6px 0}
.map-over p{margin:0;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.5}
.open-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.open-lbl.on{color:var(--copper-2)}
.side-cards{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:var(--r-xl);padding:24px}
.card h4{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.hours{list-style:none;margin:0;padding:0}
.hours li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--text-2)}
.hours li:last-child{border:0}
.hours li b{color:var(--cream);font-weight:600}
.hours li.today,.hours li.today b{color:var(--copper-2)}
.hours li.closed span{color:var(--text-3)}
.crow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);transition:transform .35s var(--ease)}
.crow:last-child{border:0}
.crow:hover{transform:translateX(4px)}
.crow .ic{width:42px;height:42px;border-radius:12px;background:var(--card-2);display:grid;place-items:center}
.crow b{display:block;font-size:14.5px;font-weight:700}
.crow span{font-size:12.5px;color:var(--text-2)}
.crow>svg:last-child{margin-left:auto;color:var(--text-3)}

.final{max-width:1320px;margin:0 auto;padding:150px 20px 100px;text-align:center}
.h-giant{font-family:var(--disp);font-weight:400;font-size:clamp(54px,11vw,172px);line-height:.9;margin:0 0 42px;text-transform:uppercase}

#ftr{border-top:1px solid var(--line)}
.ftr-in{max-width:1320px;margin:0 auto;padding:36px 20px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;color:var(--text-3);font-size:13px}
.ftr-brand{display:flex;align-items:center;gap:12px}
.ftr-brand img{width:46px}
.ftr-in button{color:var(--text-3);font-weight:600;transition:color .25s}
.ftr-in button:hover{color:var(--cream)}
body[data-route=admin] #ftr,body[data-route=agendar] #ftr,body[data-route=confirmacion] #ftr{display:none}

/* ---------- vistas tipo app ---------- */
.appv{max-width:600px;margin:0 auto;padding:calc(92px + env(safe-area-inset-top,0px)) 20px 150px}
.appv.center{text-align:center}
.app-top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.app-steps{flex:1;display:flex;gap:6px}
.app-steps i{flex:1;height:3px;border-radius:3px;background:var(--card-2);position:relative;overflow:hidden}
.app-steps i.done{background:var(--cream)}
.app-steps i.now::after{content:"";position:absolute;inset:0;background:var(--cream);transform-origin:left;animation:fill .9s var(--ease) both}
.app-count{font-size:13px;font-weight:800;color:var(--text-3);min-width:28px;text-align:right}
.app-title{font-weight:800;font-size:clamp(31px,7.5vw,42px);letter-spacing:-.04em;line-height:1.05;margin:0 0 8px}
.app-sub{color:var(--text-2);margin:0 0 28px;font-size:15px;line-height:1.55}
.enter .app-title,.enter .app-sub{animation:rise .6s var(--ease) both}
.enter .app-sub{animation-delay:.06s}
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.style-card{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--card);text-align:left;box-shadow:inset 0 0 0 1px var(--line);transition:transform .45s var(--ease),box-shadow .3s}
.style-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.style-card .ph-empty{position:absolute;inset:0}
.style-card .sc-check{position:absolute;top:12px;right:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--cream);color:#111;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease)}
.style-card .sc-check svg{width:16px;height:16px}
.style-card.on{box-shadow:0 0 0 3px var(--cream);transform:scale(.97)}
.style-card.on .sc-check{transform:scale(1)}
.style-card.any{grid-column:1/-1;aspect-ratio:auto;min-height:118px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--card-2),var(--card))}
.any-in{text-align:center;padding:20px}
.any-in svg{width:26px;height:26px;color:var(--copper-2);margin:0 auto 10px;display:block}
.any-in b{display:block;font-size:17px;font-weight:800}
.any-in span{display:block;font-size:13px;color:var(--text-2);margin-top:4px}
.slot-group{margin-bottom:20px}
.slot-group h5{margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:800}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;height:54px;padding:0 18px;border-radius:14px;background:var(--card);border:1px solid transparent;outline:0;font-size:16px;transition:border-color .25s,background .25s;color-scheme:dark}
.field textarea{height:auto;min-height:104px;padding:14px 18px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text-3);background:var(--card-2)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field small{display:block;font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.45}
.sum-card{background:var(--card);border-radius:24px;padding:6px 20px;margin:10px 0 18px}
.sum-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sum-row:last-child{border:0}
.sum-row>span{color:var(--text-2)}
.sum-row b{font-weight:700;text-align:right}
.sum-row b button{color:var(--copper-2);font-size:12.5px;font-weight:800;margin-left:10px}
.sum-row.total b{font-family:var(--disp);font-size:30px;font-weight:400}

/* confirmación */
.ok-anim{width:96px;height:96px;margin:0 auto 22px}
.ok-anim svg{width:100%;height:100%}
.ok-anim circle{fill:none;stroke:var(--copper);stroke-width:2.5;stroke-dasharray:227;stroke-dashoffset:227;animation:draw 1s var(--ease) .1s forwards}
.ok-anim path{fill:none;stroke:var(--cream);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s var(--ease) .8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

const S = {
  route:"inicio", adminTab:"hoy", config:{}, servicios:[], estilos:[], horarios:[], bloqueos:[],
  citasMap:{}, citasAt:0, resenas:[], promedio:null, totalResenas:0,

const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_C = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const VENTANA_DIAS = 30;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEF_RECORD = "Hola {nombre}, te recuerdo tu cita de {servicio} el {fecha} a las {hora} en {negocio}. ¡Te espero!";
const DEF_ESPERA = "Hola {nombre}, se liberó un espacio el {fecha} en {negocio}. ¿Te interesa? Respóndeme y te lo aparto.";

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ const v = Number(n||0); return "Q" + (Number.isInteger(v) ? v : v.toFixed(2)); }
function pad(n){ return String(n).padStart(2,"0"); }
function isoDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseIso(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function fmtFecha(iso){ const d = parseIso(iso); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MES_C[d.getMonth()]}`; }
function fmtFechaLarga(iso){ const d = parseIso(iso); return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; }
function hhmm(t){ return t ? String(t).slice(0,5) : ""; }
function toMin(t){ const [h,m] = hhmm(t).split(":").map(Number); return h*60 + m; }
function addMin(t, mins){ const total = toMin(t) + mins; return pad(Math.floor(total/60)%24) + ":" + pad(total%60); }
function ahoraHHMM(){ const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function durTxt(min){ min = Number(min)||0; if(min < 60) return min + " min"; const h = Math.floor(min/60), m = min%60; return h + " h" + (m ? " " + m + " min" : ""); }
function primerNombre(n){ return String(n||"").trim().split(/\s+/)[0] || ""; }
function iniciales(n){ const p = String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); }
function soloDigitos(t){ return String(t||"").replace(/\D/g,""); }
function titulo(t){ return esc(t||"").replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>"); }
function plantilla(tpl, v){ return String(tpl||"").replace(/\{(\w+)\}/g, (m,k)=> v[k] != null ? v[k] : m); }

  return "https://wa.me/" + n + (text ? "?text=" + encodeURIComponent(text) : "");
}

async function cargarDatosBase(){
  try{
    const [cfg, serv, est, hor, bloq] = await Promise.all([
      sb.from("config_negocio").select("*").eq("id",1).maybeSingle(),
      sb.from("servicios").select("*").eq("activo",true).order("orden"),
      sb.from("estilos_corte").select("*").eq("activo",true).order("orden"),
      sb.from("horarios").select("*").order("dia_semana"),
      sb.from("bloqueos").select("*").gte("fecha", isoDate(new Date())),
    ]);
    S.config = cfg.data || {nombre:"Imperio Store Barber"};
    S.servicios = serv.data || [];
    S.estilos = est.data || [];
    S.horarios = hor.data || [];
    S.bloqueos = bloq.data || [];
  }catch(e){ console.error(e); S.config = S.config.nombre ? S.config : {nombre:"Imperio Store Barber"}; }
  try{
    let r = await sb.from("resenas").select("calificacion,comentario,nombre,creado_en,citas(clientes(nombre))").order("creado_en",{ascending:false});
    if(r.error) r = await sb.from("resenas").select("calificacion,comentario,creado_en,citas(clientes(nombre))").order("creado_en",{ascending:false});
    const todas = r.data || [];
    S.totalResenas = todas.length;
    S.promedio = todas.length ? (todas.reduce((a,x)=>a + x.calificacion, 0) / todas.length).toFixed(1) : null;
    S.resenas = todas.filter(x=> x.calificacion >= 4 && String(x.comentario||"").trim()).slice(0,12).map(x=>({
      calificacion:x.calificacion, comentario:x.comentario,
      nombre: x.nombre || (x.citas && x.citas.clientes ? primerNombre(x.citas.clientes.nombre) : "")
    }));
  }catch(e){ console.error(e); }
}
async function cargarCitasRango(force){
  if(!force && Date.now() - S.citasAt < 45000) return;
  const hoy = new Date(), fin = new Date(); fin.setDate(hoy.getDate() + VENTANA_DIAS + 1);
  const {data} = await sb.from("citas").select("fecha,hora_inicio,hora_fin,estado").gte("fecha", isoDate(hoy)).lte("fecha", isoDate(fin)).neq("estado","cancelada");
  S.citasMap = {};
  (data||[]).forEach(c=>{ (S.citasMap[c.fecha] = S.citasMap[c.fecha] || []).push({hora_inicio:hhmm(c.hora_inicio), hora_fin:hhmm(c.hora_fin), estado:c.estado}); });
  S.citasAt = Date.now();
}

/* ---------------- disponibilidad ---------------- */
function diasVentana(n=VENTANA_DIAS){
  const out = [], hoy = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()+i);
    const iso = isoDate(d), dow = d.getDay();
    const h = S.horarios.find(x=>x.dia_semana === dow);
    const bloqueado = S.bloqueos.some(b=> b.fecha === iso && b.todo_el_dia);
    out.push({iso, dia:d.getDate(), dow, mes:d.getMonth(), disponible: !!(h && h.activo) && !bloqueado});
  }
  return out;
}
function calcularSlots(fechaIso, dur){
  const dow = parseIso(fechaIso).getDay();
  const h = S.horarios.find(x=>x.dia_semana === dow);
  if(!h || !h.activo || !dur) return [];
  if(S.bloqueos.some(b=> b.fecha === fechaIso && b.todo_el_dia)) return [];
  const paso = Number(h.intervalo_minutos) || 30;
  const ini = toMin(h.hora_inicio), fin = toMin(h.hora_fin);
  const bloqueos = S.bloqueos.filter(b=> b.fecha === fechaIso && !b.todo_el_dia && b.hora_inicio && b.hora_fin);
  const citas = S.citasMap[fechaIso] || [];
  const esHoy = fechaIso === isoDate(new Date());
  const ahora = toMin(ahoraHHMM()) + 15;
  const slots = [];
  for(let m = ini; m + dur <= fin; m += paso){
    if(esHoy && m < ahora) continue;
    const f = m + dur;
    const choca = bloqueos.some(b=> m < toMin(b.hora_fin) && f > toMin(b.hora_inicio)) ||
                  citas.some(c=> c.estado !== "cancelada" && m < toMin(c.hora_fin) && f > toMin(c.hora_inicio));
    slots.push({hora: pad(Math.floor(m/60)) + ":" + pad(m%60), ocupado: choca});
  }
  return slots;
}
function proximoHorario(){
  const dur = S.servicios.length ? Math.min(...S.servicios.map(s=> s.duracion_minutos || 30)) : 30;
  for(const d of diasVentana()){
    if(!d.disponible) continue;
    const libre = calcularSlots(d.iso, dur).find(s=> !s.ocupado);
    if(libre) return {iso:d.iso, hora:libre.hora};
  }
  return null;
}
function estadoHoy(){
  const now = new Date(), iso = isoDate(now);
  const h = S.horarios.find(x=> x.dia_semana === now.getDay());
  const bloq = S.bloqueos.some(b=> b.fecha === iso && b.todo_el_dia);
  if(!h || !h.activo || bloq) return {abierto:false, texto:"Cerrado hoy"};
  const m = toMin(ahoraHHMM()), a = toMin(h.hora_inicio), c = toMin(h.hora_fin);
  const rango = hhmm(h.hora_inicio) + " – " + hhmm(h.hora_fin);
  if(m >= a && m < c) return {abierto:true, texto:"Abierto ahora · " + rango};
  return {abierto:false, texto: m < a ? "Abre hoy a las " + hhmm(h.hora_inicio) : "Cerrado ahora · " + rango};
}

const RUTAS = ["inicio","agendar","confirmacion","mis-citas","resena","admin"];
function rutaDesdeHash(){ const h = location.hash.replace("#","").split("?")[0]; return RUTAS.includes(h) ? h : "inicio"; }
function go(route, opt={}){
  S.route = route;
  const url = route === "inicio" ? location.pathname + location.search : "#" + route;
  const actual = location.hash || "";
  const destino = route === "inicio" ? "" : "#" + route;
  if(actual !== destino){ try{ opt.replace ? history.replaceState(null, "", url) : history.pushState(null, "", url); }catch(e){} }
  render();
  if(opt.scroll !== false) window.scrollTo({top:0, left:0, behavior:"instant"});
}

function activarReveal(root){
  const els = $$(".reveal", root);
  if(!("IntersectionObserver" in window) || REDUCED){ els.forEach(e=> e.classList.add("in")); contarNumeros(root); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); contarNumeros(en.target); io.unobserve(en.target); } });
  }, {threshold:.12, rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=> io.observe(e));
}
function contarNumeros(root){
  $$("[data-count]", root).forEach(el=>{
    if(el.dataset.done) return; el.dataset.done = "1";
    const m = String(el.textContent).match(/^(\D*)(\d+(?:\.\d+)?)(.*)$/); if(!m || REDUCED) return;
    const [ , pre, num, post] = m, target = parseFloat(num), dec = (num.split(".")[1]||"").length, t0 = performance.now();
    const step = now=>{ const p = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1-p, 3);
      el.textContent = pre + (target * e).toFixed(dec) + post; if(p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

      <div class="book-card reveal" data-d="1">
        <div class="seg" id="perfilTabs" role="tablist">
          <button data-ptab="reserva">Reserva</button>
          ${S.estilos.length && c.mostrar_galeria !== false ? `<button data-ptab="estilos">Estilos</button>` : ""}
          ${S.resenas.length && c.mostrar_resenas !== false ? `<button data-ptab="resenas">Reseñas</button>` : ""}
        </div>
        <div id="perfilBody"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="servicios">
    <div class="sec-head row reveal">
      <div><span class="kicker">Servicios</span><h2 class="h-xl">La carta</h2></div>
      ${S.servicios.length > 6 ? `<label class="search">${IC.search}<input id="svcQ" placeholder="Buscar servicio, precio o duración" value="${esc(S.svcQ)}" aria-label="Buscar servicio"></label>` : ""}
    </div>
    <div class="cat-chips reveal" id="svcCats"></div>
    <div class="tiles reveal" data-d="1" id="svcTiles"></div>
  </section>

  ${seccionUbicacion()}

  <section class="final reveal">
    <span class="kicker">Reserva ahora</span>
    <h2 class="h-giant">${titulo(c.frase_cierre || "Tu próximo corte\n*empieza aquí*")}</h2>
    <button class="pill pill-white pill-lg" data-reservar>Agendar cita ${IC.arrowR}</button>
  </section>

  <div class="fbar" id="svcBar"></div>`;

  // cableado
  $$("[data-serv]", app).forEach(b=> b.onclick = ()=> iniciarReserva({servicio: S.servicios.find(s=> String(s.id) === b.dataset.serv)}));
  $("#perfilTabs").onclick = e=>{ const b = e.target.closest("[data-ptab]"); if(!b) return; S.perfilTab = b.dataset.ptab; pintarPerfil(); };
  if(!$(`[data-ptab="${S.perfilTab}"]`)) S.perfilTab = "reserva";
  pintarPerfil();
  const q = $("#svcQ"); if(q) q.oninput = ()=>{ S.svcQ = q.value; pintarTiles(); };
  pintarTiles();
  activarReveal(app);
}

function svcRow(s,i){
  return `<button class="svc-row" data-serv="${s.id}" style="--i:${i}">
    <span class="nm">${esc(s.nombre)}<small>${durTxt(s.duracion_minutos)}</small></span>
    <span class="rt"><span class="pr">${money(s.precio)}</span><span class="bk">Reservar ${IC.arrowR}</span></span>
  </button>`;
}

function marquesina(){
  const items = S.servicios.length ? S.servicios.map(s=> s.nombre) : ["Cortes","Fades","Barba","Diseños","Toalla caliente"];
  const seq = items.map(t=> `<span>${esc(t)}</span><b>✦</b>`).join("");
  let mitad = seq; while(mitad.length < 1200) mitad += seq;
  return `<div class="mq" aria-hidden="true"><div class="mq-track">${mitad}${mitad}</div></div>`;
}

function tarjetaBarbero(){
  const c = S.config;
  const nombre = c.barbero_nombre || c.nombre || "Imperio Store Barber";
  return `<article class="pro-card reveal">
    <div class="pro-photo">
      ${c.barbero_foto_url ? `<img class="ph" src="${esc(c.barbero_foto_url)}" alt="${esc(nombre)}" loading="lazy">` : `<img class="lg" src="${LOGO}" alt="">`}
      <div class="pro-shade"></div>
      <div class="pro-id">
        <h3>${esc(nombre)}</h3>
        <div class="pro-meta">
          ${S.promedio ? `<span class="rate">${IC.star}${S.promedio} (${S.totalResenas})</span>` : ""}
          <span class="tag-c">${esc(c.barbero_titulo || "Pro barber")}</span>
        </div>
      </div>
    </div>
    <p class="pro-bio">${esc(c.barbero_bio || "Cada corte es una pieza hecha a tu medida: escucho lo que buscas, estudio tu tipo de cabello y lo ejecuto con técnica y detalle.")}</p>
    <div class="pro-stats">
      <div><b data-count>${esc(c.anios_experiencia || "+5")}</b><span>Años</span></div>
      <div><b data-count>${esc(c.clientes_atendidos || "+1000")}</b><span>Clientes</span></div>
      <div><b data-count>${S.promedio || "5.0"}</b><span>Calificación</span></div>
    </div>
  </article>`;
}

/* ---------- pestañas: reserva rápida / estilos / reseñas ---------- */
function pintarPerfil(){
  const body = $("#perfilBody"); if(!body) return;
  $$("#perfilTabs [data-ptab]").forEach(b=> b.classList.toggle("on", b.dataset.ptab === S.perfilTab));
  if(S.perfilTab === "estilos"){
    body.innerHTML = `<div class="pbody"><p class="lbl">Toca un estilo para reservarlo</p><div class="port-grid">${S.estilos.map((e,i)=>`
      <button class="port-item" data-estilo="${e.id}" style="--i:${i}">
        ${e.foto_url ? `<img src="${esc(e.foto_url)}" alt="${esc(e.nombre)}" loading="lazy">` : `<div class="ph-empty">${IC.scissors}</div>`}
        <div class="cap"><span>${esc(e.categoria || "Estilo")}</span><b>${esc(e.nombre)}</b></div>
      </button>`).join("")}</div></div>`;
    $$("[data-estilo]", body).forEach(b=> b.onclick = ()=> iniciarReserva({estilo: S.estilos.find(e=> String(e.id) === b.dataset.estilo)}));
    return;
  }
  if(S.perfilTab === "resenas"){
    body.innerHTML = `<div class="pbody">
      <div class="rv-head"><b>${S.promedio || "—"}</b><div>${starsHtml(S.promedio)}<span>${S.totalResenas} reseñas verificadas</span></div></div>
      <div class="rv-list">${S.resenas.map((r,i)=>`
        <div class="rv" style="--i:${i}"><div class="rv-top"><span class="av">${esc(iniciales(r.nombre || "C"))}</span><div><b>${esc(r.nombre || "Cliente")}</b>${starsHtml(r.calificacion)}</div></div><p>${esc(r.comentario)}</p></div>`).join("")}
      </div></div>`;
    return;
  }
  // reserva rápida
  const q = S.quick;
  if(!S.servicios.length){ body.innerHTML = `<div class="empty-note">Aún no hay servicios publicados.</div>`; return; }
  if(!q.servId || !S.servicios.some(s=> s.id === q.servId)) q.servId = S.servicios[0].id;
  const serv = S.servicios.find(s=> s.id === q.servId);
  const dias = diasVentana();
  if(!q.fecha || !dias.some(d=> d.iso === q.fecha && d.disponible)) q.fecha = (dias.find(d=> d.disponible) || {}).iso || null;
  const slots = q.fecha ? calcularSlots(q.fecha, serv.duracion_minutos).filter(s=> !s.ocupado) : [];
  if(q.hora && !slots.some(s=> s.hora === q.hora)) q.hora = null;
  const mesRef = q.fecha ? parseIso(q.fecha) : new Date();
  const prevScroll = $("#qDates") ? $("#qDates").scrollLeft : null;

  body.innerHTML = `<div class="${body.dataset.init ? "" : "pbody"}">
    <p class="lbl">Servicio</p>
    <div class="chips-scroll">${S.servicios.map(s=>`<button class="chip ${s.id===q.servId?"on":""}" data-qserv="${s.id}">${esc(s.nombre)}</button>`).join("")}</div>
    <div class="month-row"><span>${MESES[mesRef.getMonth()]} ${mesRef.getFullYear()}</span>
      <div style="display:flex;gap:6px"><button class="circ" data-qscroll="-1" aria-label="Anteriores">${IC.chevL}</button><button class="circ" data-qscroll="1" aria-label="Siguientes">${IC.chevR}</button></div></div>
    <div class="date-row" id="qDates">${dias.map(d=>`<button class="dchip ${d.iso===q.fecha?"on":""} ${d.disponible?"":"off"}" data-qdate="${d.iso}" aria-label="${fmtFechaLarga(d.iso)}"><b>${d.dia}</b><span>${DIAS_C[d.dow]}</span></button>`).join("")}</div>
    <p class="lbl">Hora</p>
    <div class="time-row">${slots.length ? slots.map(s=>`<button class="tpill ${s.hora===q.hora?"on":""}" data-qhora="${s.hora}">${s.hora}</button>`).join("")
      : `<div class="empty-note">${q.fecha ? "No quedan horarios libres este día." : "No hay días disponibles por ahora."} ${q.fecha ? `<button class="link-btn" data-wait="${q.fecha}">Anotarme en la lista de espera</button>` : ""}</div>`}</div>
    <div class="qb-summary ${q.hora?"ready":""}">
      <div class="qs-l">${IC.cal}<div><b>${q.fecha ? fmtFechaLarga(q.fecha) : "Elige una fecha"}</b><span>${q.hora ? `${q.hora} – ${addMin(q.hora, serv.duracion_minutos)} · ${esc(serv.nombre)}` : "Elige una hora"}</span></div></div>
      <div class="qs-r"><span class="qs-price">${money(serv.precio)}</span><button class="pill pill-black" id="qBook" ${q.hora?"":"disabled"}>Reservar</button></div>
    </div></div>`;
  body.dataset.init = "1";
  const row = $("#qDates", body);
  if(prevScroll !== null) row.scrollLeft = prevScroll;
  else { const on = $(".dchip.on", row); if(on) row.scrollLeft = on.offsetLeft - row.offsetLeft - 8; }

  body.onclick = e=>{
    const t = e.target.closest("[data-qserv],[data-qdate],[data-qhora],[data-qscroll],[data-wait],#qBook"); if(!t) return;
    if(t.dataset.qserv){ q.servId = Number(t.dataset.qserv); q.hora = null; }
    else if(t.dataset.qdate){ q.fecha = t.dataset.qdate; q.hora = null; }
    else if(t.dataset.qhora){ q.hora = t.dataset.qhora; }
    else if(t.dataset.qscroll){ row.scrollBy({left: Number(t.dataset.qscroll) * 280, behavior: REDUCED ? "auto" : "smooth"}); return; }
    else if(t.dataset.wait){ return abrirEspera(t.dataset.wait); }
    else if(t.id === "qBook"){
      S.booking = nuevaReserva(); Object.assign(S.booking, {servicio: serv, fecha: q.fecha, hora: q.hora});
      S.wizardStep = 2; S.lastStep = 0; return go("agendar");
    }
    pintarPerfil();
  };
}

/* ---------- mosaico de servicios ---------- */
function pintarTiles(){
  const box = $("#svcTiles"); if(!box) return;
  const cats = [...new Set(S.servicios.map(s=> (s.categoria||"").trim()).filter(Boolean))];
  const catBox = $("#svcCats");
  if(catBox){
    catBox.innerHTML = cats.length ? [`<button class="chip ${!S.svcCat?"on":""}" data-cat="">Todos</button>`, ...cats.map(k=>`<button class="chip ${S.svcCat===k?"on":""}" data-cat="${esc(k)}">${esc(k)}</button>`)].join("") : "";
    catBox.onclick = e=>{ const b = e.target.closest("[data-cat]"); if(!b) return; S.svcCat = b.dataset.cat; pintarTiles(); };
  }
  const q = S.svcQ.trim().toLowerCase();
  const lista = S.servicios.filter(s=>{
    if(S.svcCat && (s.categoria||"").trim() !== S.svcCat) return false;
    if(!q) return true;
    return [s.nombre, s.descripcion, String(s.precio), durTxt(s.duracion_minutos), String(s.duracion_minutos)].join(" ").toLowerCase().includes(q);
  });
  box.innerHTML = lista.length ? lista.map((s,i)=> tileHtml(s, S.svcSel === s.id, i)).join("")
    : `<div class="adm-empty" style="grid-column:1/-1">No encontramos servicios con “${esc(S.svcQ)}”.</div>`;
  box.onclick = e=>{ const t = e.target.closest("[data-tile]"); if(!t) return; const id = Number(t.dataset.tile); S.svcSel = S.svcSel === id ? null : id; pintarTiles(); };
  const bar = $("#svcBar"), sel = S.servicios.find(s=> s.id === S.svcSel);
  if(sel){
    bar.innerHTML = `<div class="fbar-i"><b>${esc(sel.nombre)}</b><span>${durTxt(sel.duracion_minutos)} · ${money(sel.precio)}</span></div>
      <button class="circ" id="svcBarX" aria-label="Quitar selección">${IC.x}</button>
      <button class="pill pill-white pill-sm" id="svcBarGo">Reservar ${IC.arrowR}</button>`;
    bar.classList.add("on");
    $("#svcBarX").onclick = ()=>{ S.svcSel = null; pintarTiles(); };
    $("#svcBarGo").onclick = ()=>{ S.svcSel = null; iniciarReserva({servicio: sel}); };
  } else bar.classList.remove("on");
}
function tileHtml(s, on, i=0, extra=""){
  return `<button class="tile ${on?"on":""} ${extra}" data-tile="${s.id}" style="--i:${i}">
    ${s.foto_url ? `<img class="tile-img" src="${esc(s.foto_url)}" alt="" loading="lazy">` : ""}
    <span class="tick">${IC.check}</span>
    <span class="tile-nm">${esc(s.nombre)}</span>
    ${s.descripcion ? `<span class="tile-ds">${esc(s.descripcion)}</span>` : ""}
    <span class="tile-ft"><span>${durTxt(s.duracion_minutos)}</span><b>${money(s.precio)}</b></span>
  </button>`;
}

/* ---------- ubicación ---------- */
function seccionUbicacion(){
  const c = S.config, est = estadoHoy(), hoy = new Date().getDay();
  const wa = waLink(c.whatsapp, "Hola, quiero información para agendar.");
  const filas = [];
  if(wa) filas.push(`<a class="crow" href="${wa}" target="_blank" rel="noopener"><span class="ic">${IC.wa}</span><div><b>WhatsApp</b><span>Escríbenos directo</span></div>${IC.chevR}</a>`);
  if(c.instagram) filas.push(`<a class="crow" href="${esc(c.instagram)}" target="_blank" rel="noopener"><span class="ic">${IC.ig}</span><div><b>Instagram</b><span>Trabajos recientes</span></div>${IC.chevR}</a>`);
  if(c.tiktok) filas.push(`<a class="crow" href="${esc(c.tiktok)}" target="_blank" rel="noopener"><span class="ic">${IC.tt}</span><div><b>TikTok</b><span>Videos y cortes</span></div>${IC.chevR}</a>`);
  if(c.facebook) filas.push(`<a class="crow" href="${esc(c.facebook)}" target="_blank" rel="noopener"><span class="ic">${IC.fb}</span><div><b>Facebook</b><span>Noticias y promos</span></div>${IC.chevR}</a>`);
  return `<section class="sec" id="ubicacion">
    <div class="sec-head reveal"><span class="kicker">Visítanos</span><h2 class="h-xl">Ubicación</h2></div>
    <div class="loc-grid">
      <div class="map-card reveal">
        ${c.maps_embed_url ? `<iframe src="${esc(c.maps_embed_url)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa de ubicación"></iframe>` : `<div class="map-ph"><span class="pinb">${IC.pin}</span></div>`}
        <div class="map-over">
          <div>
            <span class="open-lbl ${est.abierto?"on":""}">${esc(est.texto)}</span>
            <h3>${esc(c.nombre || "Imperio Store Barber")}</h3>
            <p>${S.promedio ? `${starsHtml(S.promedio)} ${S.promedio} (${S.totalResenas}) ·` : ""} ${esc(c.direccion || "Dirección por confirmar")}</p>
          </div>
          ${c.maps_link ? `<a class="pill pill-white" href="${esc(c.maps_link)}" target="_blank" rel="noopener">Cómo llegar ${IC.arrowR}</a>` : ""}
        </div>
      </div>
      <div class="side-cards">
        <div class="card reveal" data-d="1"><h4>Horario</h4><ul class="hours">
          ${[1,2,3,4,5,6,0].map(d=>{ const h = S.horarios.find(x=> x.dia_semana === d); const ab = h && h.activo;
            return `<li class="${d===hoy?"today":""} ${ab?"":"closed"}"><b>${DIAS[d]}${d===hoy?" · hoy":""}</b><span>${ab ? hhmm(h.hora_inicio)+" – "+hhmm(h.hora_fin) : "Cerrado"}</span></li>`; }).join("")}
        </ul></div>
        ${filas.length ? `<div class="card reveal" data-d="2"><h4>Contacto</h4>${filas.join("")}</div>` : ""}
      </div>
    </div>
  </section>`;
}
</script>
<script>
/* ============================================================
   APP DE RESERVA (referencia: Black Box)
   ============================================================ */
function nuevaReserva(){ const l = leerLocal(); return {servicio:null, estilo:null, sorprende:false, fecha:null, hora:null, nombre:l.nombre||"", telefono:l.telefono||""}; }
function iniciarReserva(o={}){
  S.booking = nuevaReserva(); S.wizardStep = 1; S.lastStep = 0;
  if(o.servicio){ S.booking.servicio = o.servicio; S.wizardStep = 2; }
  if(o.estilo){ S.booking.estilo = o.estilo; }
  if(o.paso) S.wizardStep = o.paso;
  go("agendar");
}

function renderWizard(app){
  if(!S.booking) S.booking = nuevaReserva();
  const b = S.booking;
  if(!b.servicio) S.wizardStep = 1;
  const st = S.wizardStep, entra = st !== S.lastStep; S.lastStep = st;
  if(st === 3 && Date.now() - S.citasAt > 45000){ cargarCitasRango(true).then(()=>{ if(S.route === "agendar" && S.wizardStep === 3){ S.lastStep = 3; renderWizard(app); } }); }
  const T = [["¿Qué te vas a hacer?","Elige el servicio que quieres"],["Elige tu estilo","Así sabremos exactamente lo que buscas"],["Fecha y hora","Disponibilidad en tiempo real"],["Tus datos","Solo falta confirmar tu cita"]][st-1];
  const prevScroll = $("#wDates") ? $("#wDates").scrollLeft : null;

  let body = "";
  if(st === 1){
    body = S.servicios.length ? `<div class="tiles ${entra?"stg":""}" style="grid-template-columns:repeat(2,1fr)">${S.servicios.map((s,i)=> tileHtml(s, b.servicio && b.servicio.id === s.id, i)).join("")}</div>`
      : `<div class="adm-empty">Aún no hay servicios disponibles.</div>`;
  }
  if(st === 2){
    body = `<div class="style-grid ${entra?"stg":""}">${S.estilos.map((e,i)=>`
      <button class="style-card ${b.estilo && b.estilo.id === e.id ? "on" : ""}" data-west="${e.id}" style="--i:${i}">
        ${e.foto_url ? `<img src="${esc(e.foto_url)}" alt="${esc(e.nombre)}" loading="lazy">` : `<div class="ph-empty">${IC.scissors}</div>`}
        <i class="sc-check">${IC.check}</i>
        <div class="cap"><span>${esc(e.categoria || "Estilo")}</span><b>${esc(e.nombre)}</b></div>
      </button>`).join("")}
      <button class="style-card any ${b.sorprende?"on":""}" data-west="any" style="--i:${S.estilos.length}">
        <i class="sc-check">${IC.check}</i>
        <div class="any-in">${IC.scissors}<b>Que decida el barbero</b><span>Te recomienda algo según tu cabello</span></div>
      </button></div>`;
  }
  if(st === 3){
    const dias = diasVentana();
    if(!b.fecha || !dias.some(d=> d.iso === b.fecha && d.disponible)) b.fecha = (dias.find(d=> d.disponible) || {}).iso || null;
    const slots = b.fecha ? calcularSlots(b.fecha, b.servicio.duracion_minutos) : [];
    if(b.hora && !slots.some(s=> s.hora === b.hora && !s.ocupado)) b.hora = null;
    const libres = slots.filter(s=> !s.ocupado).length;
    const grupos = [["Mañana", s=> toMin(s.hora) < 720], ["Tarde", s=> toMin(s.hora) >= 720 && toMin(s.hora) < 1080], ["Noche", s=> toMin(s.hora) >= 1080]];
    const ref = b.fecha ? parseIso(b.fecha) : new Date();
    body = `<div class="${entra?"stg":""}">
      <div class="month-row" style="--i:0"><span>${MESES[ref.getMonth()]} ${ref.getFullYear()}</span>
        <div style="display:flex;gap:6px"><button class="circ" data-wscroll="-1" aria-label="Anteriores">${IC.chevL}</button><button class="circ" data-wscroll="1" aria-label="Siguientes">${IC.chevR}</button></div></div>
      <div class="date-row" id="wDates" style="--i:1">${dias.map(d=>`<button class="dchip ${d.iso===b.fecha?"on":""} ${d.disponible?"":"off"}" data-wdate="${d.iso}" aria-label="${fmtFechaLarga(d.iso)}"><b>${d.dia}</b><span>${DIAS_C[d.dow]}</span></button>`).join("")}</div>
      ${libres ? grupos.map(([n,f],gi)=>{ const l = slots.filter(f); return l.length ? `<div class="slot-group" style="--i:${gi+2}"><h5>${n}</h5><div class="time-row" style="margin:0">${l.map(s=>`<button class="tpill ${s.ocupado?"taken":""} ${b.hora===s.hora?"on":""}" data-whora="${s.hora}" ${s.ocupado?"disabled":""}>${s.hora}</button>`).join("")}</div></div>` : ""; }).join("")
        : `<div class="empty-note" style="--i:2">${b.fecha ? "No quedan horarios libres este día. Elige otra fecha o anótate y te avisamos si se libera un espacio." : "No hay días disponibles por ahora."}
           ${b.fecha ? `<div style="margin-top:14px"><button class="pill pill-white pill-sm" data-wait="${b.fecha}">Anotarme en lista de espera</button></div>` : ""}</div>`}
    </div>`;
  }
  if(st === 4){
    const l = leerLocal();
    body = `<div class="${entra?"stg":""}">
      <div class="field" style="--i:0"><label for="fNombre">Nombre completo</label><input id="fNombre" autocomplete="name" value="${esc(b.nombre)}" placeholder="Ej. Carlos Pérez"></div>
      <div class="field" style="--i:1"><label for="fTel">WhatsApp</label><input id="fTel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(b.telefono)}" placeholder="Ej. 5512 3456"><small>Aquí te llega la confirmación y el recordatorio.</small></div>
      ${S.config.referidos_activo && !l.telefono ? `<div class="field" style="--i:2"><label for="fRef">Código de referido (opcional)</label><input id="fRef" autocapitalize="characters" placeholder="Si alguien te invitó"></div>` : ""}
      <div class="sum-card" style="--i:3">
        <div class="sum-row"><span>Servicio</span><b>${esc(b.servicio.nombre)}<button data-wgo="1">Cambiar</button></b></div>
        <div class="sum-row"><span>Estilo</span><b>${b.estilo ? esc(b.estilo.nombre) : "El barbero decide"}<button data-wgo="2">Cambiar</button></b></div>
        <div class="sum-row"><span>Fecha</span><b>${fmtFechaLarga(b.fecha)}<button data-wgo="3">Cambiar</button></b></div>
        <div class="sum-row"><span>Hora</span><b>${b.hora} – ${addMin(b.hora, b.servicio.duracion_minutos)}</b></div>
        <div class="sum-row total"><span>Total</span><b>${money(b.servicio.precio)}</b></div>
      </div>
    </div>`;
  }

  // barra inferior
  let info = "", ok = false, txt = "Continuar";
  if(st === 1){ ok = !!b.servicio; info = ok ? `<b>${esc(b.servicio.nombre)}</b><span>${durTxt(b.servicio.duracion_minutos)} · ${money(b.servicio.precio)}</span>` : `<b>Selecciona un servicio</b>`; }
  if(st === 2){ ok = !!(b.estilo || b.sorprende); info = b.estilo ? `<b>${esc(b.estilo.nombre)}</b><span>${esc(b.servicio.nombre)}</span>` : b.sorprende ? `<b>El barbero decide</b><span>${esc(b.servicio.nombre)}</span>` : `<b>Elige un estilo</b>`; }
  if(st === 3){ ok = !!b.hora; info = b.hora ? `<b>${fmtFecha(b.fecha)}</b><span>${b.hora} – ${addMin(b.hora, b.servicio.duracion_minutos)}</span>` : `<b>Elige una hora</b>`; }
  if(st === 4){ ok = true; txt = "Confirmar cita"; info = `<b>${money(b.servicio.precio)}</b><span>${esc(b.servicio.nombre)}</span>`; }

  app.innerHTML = `<div class="appv ${entra?"enter":""}">
      <div class="app-top"><button class="circ" id="wBack" aria-label="Atrás">${IC.arrowL}</button>
        <div class="app-steps">${[1,2,3,4].map(n=>`<i class="${n<st?"done":n===st?(entra?"now":"done"):""}"></i>`).join("")}</div><span class="app-count">${st}/4</span></div>
      <h1 class="app-title">${T[0]}</h1><p class="app-sub">${T[1]}</p>
      <div id="wBody">${body}</div>
    </div>
    <div class="fbar" id="wBar"><div class="fbar-i ${ok?"":"muted"}">${info}</div><button class="pill pill-white" id="wNext" ${ok?"":"disabled"}>${txt} ${IC.arrowR}</button></div>`;
  requestAnimationFrame(()=> $("#wBar") && $("#wBar").classList.add("on"));

  const dates = $("#wDates");
  if(dates){ if(prevScroll !== null && !entra) dates.scrollLeft = prevScroll; else { const on = $(".dchip.on", dates); if(on) dates.scrollLeft = on.offsetLeft - dates.offsetLeft - 8; } }

  $("#wBack").onclick = ()=>{ if(st === 1) return go("inicio"); S.wizardStep = st - 1; renderWizard(app); window.scrollTo(0,0); };
  $("#wNext").onclick = ()=>{
    if(st === 4) return confirmarCita();
    let sig = st + 1;
    if(st === 2 && b.fecha && b.hora && calcularSlots(b.fecha, b.servicio.duracion_minutos).some(s=> s.hora === b.hora && !s.ocupado)) sig = 4;
    if(st === 2 && !S.estilos.length) sig = 3;
    S.wizardStep = sig; renderWizard(app); window.scrollTo(0,0);
  };
  $("#wBody").onclick = e=>{
    const t = e.target.closest("[data-tile],[data-west],[data-wdate],[data-whora],[data-wscroll],[data-wait],[data-wgo]"); if(!t) return;
    if(t.dataset.tile){ const s = S.servicios.find(x=> String(x.id) === t.dataset.tile); if(!b.servicio || b.servicio.id !== s.id){ b.servicio = s; b.hora = null; } }
    else if(t.dataset.west){ if(t.dataset.west === "any"){ b.sorprende = true; b.estilo = null; } else { b.estilo = S.estilos.find(x=> String(x.id) === t.dataset.west); b.sorprende = false; } }
    else if(t.dataset.wdate){ b.fecha = t.dataset.wdate; b.hora = null; }
    else if(t.dataset.whora){ b.hora = t.dataset.whora; }
    else if(t.dataset.wscroll){ dates.scrollBy({left: Number(t.dataset.wscroll)*280, behavior: REDUCED ? "auto" : "smooth"}); return; }
    else if(t.dataset.wait){ return abrirEspera(t.dataset.wait); }
    else if(t.dataset.wgo){ S.wizardStep = Number(t.dataset.wgo); renderWizard(app); window.scrollTo(0,0); return; }
    renderWizard(app);
  };
  if(st === 4){
    $("#fNombre").oninput = e=> b.nombre = e.target.value;
    $("#fTel").oninput = e=> b.telefono = e.target.value;
  }
  if(st === 2 && !S.estilos.length && !b.sorprende){ b.sorprende = true; renderWizard(app); }
}

async function obtenerCliente(nombre, telefono, codigoRef){
  const tel = soloDigitos(telefono);
  const {data:existe} = await sb.from("clientes").select("*").eq("telefono", tel).maybeSingle();
  if(existe){
    if(nombre && nombre !== existe.nombre) await sb.from("clientes").update({nombre}).eq("id", existe.id);
    return {...existe, nombre: nombre || existe.nombre};
  }
  let referido_por = null;
  if(codigoRef){ const {data:r} = await sb.from("clientes").select("id").eq("codigo_referido", codigoRef.toUpperCase()).maybeSingle(); if(r) referido_por = r.id; }
  const {data:nuevo, error} = await sb.from("clientes").insert({nombre, telefono: tel, codigo_referido: genCodigo(nombre), referido_por}).select().single();
  if(error) throw error;
  return nuevo;
}

async function confirmarCita(){
  const b = S.booking, btn = $("#wNext");
  b.nombre = $("#fNombre").value.trim(); b.telefono = $("#fTel").value.trim();
  const ref = $("#fRef") ? $("#fRef").value.trim() : "";
  if(b.nombre.length < 2){ toast("Escribe tu nombre"); return $("#fNombre").focus(); }
  if(soloDigitos(b.telefono).length < 8){ toast("Revisa tu número de WhatsApp"); return $("#fTel").focus(); }
  btn.disabled = true; btn.innerHTML = "Confirmando…";
  try{
    await cargarCitasRango(true);
    if(!calcularSlots(b.fecha, b.servicio.duracion_minutos).some(s=> s.hora === b.hora && !s.ocupado)){
      toast("Ese horario acaba de ocuparse. Elige otro."); b.hora = null; S.wizardStep = 3; return renderWizard($("#app"));
    }
    const cliente = await obtenerCliente(b.nombre, b.telefono, ref);
    if(b.estilo) await sb.from("clientes").update({estilo_preferido_id: b.estilo.id}).eq("id", cliente.id);
    const {data:cita, error} = await sb.from("citas").insert({
      cliente_id: cliente.id, servicio_id: b.servicio.id, estilo_id: b.estilo ? b.estilo.id : null,
      fecha: b.fecha, hora_inicio: b.hora, hora_fin: addMin(b.hora, b.servicio.duracion_minutos), estado: "confirmada"
    }).select().single();
    if(error){ toast("Ese horario ya no está disponible. Elige otro."); b.hora = null; S.citasAt = 0; S.wizardStep = 3; return renderWizard($("#app")); }
    guardarLocal({nombre: b.nombre, telefono: soloDigitos(b.telefono)});
    S.lastCita = {...cita, cliente, servicio: b.servicio, estilo: b.estilo};
    S.booking = null; S.citasAt = 0; S.quick.hora = null;
    go("confirmacion", {replace:true});
  }catch(e){
    console.error(e); toast("No pudimos confirmar. Revisa tu conexión e intenta de nuevo.");
    btn.disabled = false; btn.innerHTML = `Confirmar cita ${IC.arrowR}`;
  }
}

/* ---------------- calendario ---------------- */
function gcalLink(c, servNombre){
  const f = c.fecha.replace(/-/g,""), a = hhmm(c.hora_inicio).replace(":",""), z = hhmm(c.hora_fin).replace(":","");
  const p = new URLSearchParams({action:"TEMPLATE", text:`${servNombre} · ${S.config.nombre||"Imperio Store Barber"}`, dates:`${f}T${a}00/${f}T${z}00`, details:`Cita confirmada en ${S.config.nombre||"Imperio Store Barber"}.`, location:S.config.direccion||""});
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function icsHref(c, servNombre){
  const f = c.fecha.replace(/-/g,""), e = s=> String(s||"").replace(/([,;\\])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Imperio Store Barber//ES","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+c.id+"@imperio","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z",
    "DTSTART:"+f+"T"+hhmm(c.hora_inicio).replace(":","")+"00","DTEND:"+f+"T"+hhmm(c.hora_fin).replace(":","")+"00",
    "SUMMARY:"+e(servNombre+" · "+(S.config.nombre||"Imperio Store Barber")),"LOCATION:"+e(S.config.direccion),
    "BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Tu cita es en 2 horas","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
}

    });
  });
}
async function buscarCliente(telefono, silencioso){
  const tel = soloDigitos(telefono);
  if(tel.length < 8){ if(!silencioso) toast("Escribe tu número completo"); return; }
  const {data:cl} = await sb.from("clientes").select("*").eq("telefono", tel).maybeSingle();
  if(!cl){ toast("No encontramos citas con ese número"); return; }
  const [{data:citas}, {data:wl}] = await Promise.all([
    sb.from("citas").select("*, servicios(nombre), estilos_corte(nombre)").eq("cliente_id", cl.id).order("fecha",{ascending:false}),
    sb.from("waitlist").select("*").eq("cliente_id", cl.id),
  ]);
  S.cliente = cl;
  S.citasCliente = (citas||[]).map(c=> ({...c, servicioNombre: c.servicios && c.servicios.nombre, estiloNombre: c.estilos_corte && c.estilos_corte.nombre}));
  S.waitCliente = wl || [];
  guardarLocal({nombre: cl.nombre, telefono: tel});
  if(S.route === "mis-citas") renderMisCitas($("#app"));
}
